<title>Wildcard — Hero Icons Ambient Physics (standalone)</title>

  /* Demo-page chrome only — NOT part of the animation. Delete freely. */
  :root { --wc-ink: #1B1A17; --wc-yellow: #F5AC53; --wc-cream: #FFF6E9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--wc-cream); color: var(--wc-ink); }
  .hero { min-height: 92vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; background: var(--wc-ink); padding: 64px 24px; }
  .hero h1 { color: var(--wc-cream); font-size: 28px; font-weight: 600; margin: 0; text-align: center; }
  .hero p { color: rgba(255, 246, 233, 0.65); font-size: 15px; margin: 0; max-width: 520px; text-align: center; line-height: 1.5; }
  .spacer { padding: 96px 24px; text-align: center; font-size: 15px; color: rgba(27, 26, 23, 0.55); }
  .spacer div { height: 60vh; }
</style>
</head>

<!-- The section wrapping the cluster doubles as the cursor-input surface
     (the JS listens on .hero so the cluster keeps pointer-events: none). -->
<section class="hero">
  <h1>Hero icons &mdash; ambient physics</h1>
  <p>The tiles drift and collide on their own. Move the cursor near them for a gentle push-aside; scroll the page for an inertial nudge; on a phone, tilt the device.</p>

  <!-- THE ANIMATION: this block + icons-physics.css + icons-physics.js -->
  <div class="hero-cluster" aria-hidden="true">
    <span class="tile c1-top"><svg viewBox="0 0 125 125"><use href="#i-flute"></use></svg></span>
    <span class="tile c1-bottom"><svg viewBox="0 0 125 125"><use href="#i-heart"></use></svg></span>
    <span class="tile c2-top"><svg viewBox="0 0 125 125"><use href="#i-martini"></use></svg></span>
    <span class="tile c2-bottom"><svg viewBox="0 0 125 125"><use href="#i-meeple"></use></svg></span>
    <span class="tile c3-top"><svg viewBox="0 0 125 125"><use href="#i-star"></use></svg></span>
    <span class="tile c3-bottom"><svg viewBox="0 0 125 125"><use href="#i-wine"></use></svg></span>
    <span class="tile c4-top"><svg viewBox="0 0 125 125"><use href="#i-star"></use></svg></span>
    <span class="tile c4-bottom"><svg viewBox="0 0 125 125"><use href="#i-spade"></use></svg></span>
  </div>
</section>

<div class="spacer">
  scroll &mdash; the tiles pick up a gentle vertical inertia
  <div></div>
</div>
