<!doctype html>
<html><head>
<meta charset="utf-8">
<title>Food &amp; Drink</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../btn.css">
<style>
/* =========================================================================
   FOOD & DRINK CARD — Wildcard

   Layout: a horizontal red photo strip (thin red border ~10px) with a
   floating cream card CENTERED on top. The card is a "scalloped ribbon"
   shape — circular bumps along the entire top + bottom edges, including
   the corners (no straight corner segments — the bumps wrap all the way
   to the edge).

   Card geometry (from /Designs/external/Hero/Hero.jsx FOOD & DRINK group):
   - Width:  700px
   - Height: 460px
   - Bump diameter: 78px (radius 39, 9 bumps per edge)
   - Title: Roc Grotesk 500, 65/70px, ink, centered
   - Yellow asterisk badges (55×55, ink glyph)
   - Body: Montserrat 500, 21/27, ink
   - Red pill CTA
   ========================================================================= */
body {
  margin: 0;
  background: var(--wc-black);
  font-family: var(--font-body);
}

/* The dark stage. Tall enough that the card (which extends above
   and below the photo strip via its scallop bumps) is fully visible
   with breathing room. */
.fd-stage {
  position: relative;
  width: 100%;
  background: var(--wc-black);
  min-height: 620px;
  padding: 80px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Red photo strip — THIN border per design feedback:
     10px padding around the whole strip
     8px gutters between photos
   The strip's red shows through these gaps. */
.fd-photos {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  background: var(--wc-red);
  padding: 10px;
  width: 100%;
  align-self: center;
}
.fd-photos .photo {
  aspect-ratio: 1 / 1;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-color: rgba(0,0,0,0.18);
}

/* The card floats centered, covering the middle 3 photos and dipping
   above + below the strip via its protruding scallop bumps. */
.fd-card {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 580px;          /* slightly smaller for breathing room */
  max-width: calc(100vw - 64px);
  z-index: 2;
  pointer-events: none;
}
.fd-card > * { pointer-events: auto; }

/* SVG that draws the cream scalloped shape. ViewBox padded above and
   below so the bumps that protrude past the card body still render. */
.fd-card .scallop {
  display: block;
  width: 100%;
  height: auto;
}

/* Content positioned ON TOP of the scallop SVG. We use position:absolute
   inside .fd-card and base the offsets on the SVG's aspect ratio:
     - SVG viewBox is 700 × 540 (460 + 40 for scallop bumps above & below)
     - Top padding clears the upper bump row (40 + extra breath)
     - Side padding gives the centered content breathing room
*/
.fd-card .inner {
  position: absolute;
  inset: 0;
  padding: 70px 60px 70px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
}

.fd-title-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  width: 100%;
}
.fd-title-row .badge {
  width: 55px;
  height: 55px;
  background: var(--wc-yellow);
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.fd-title-row .badge svg {
  width: 32px;
  height: 32px;
  color: var(--wc-ink);
  display: block;
}

.fd-card h2 {
  font-family: var(--font-display);
  font-stretch: var(--display-stretch);
  font-weight: 500;
  font-size: 48px;
  line-height: 52px;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--wc-ink);
  margin: 0;
  text-align: center;
  flex: 0 1 auto;
}

.fd-card p {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  line-height: 23px;
  color: var(--wc-ink);
  margin: 8px 0 0;
  max-width: 380px;
  text-wrap: pretty;
}

.fd-card .btn { margin-top: 12px; }

/* Tweaks mount */
#tweaks-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#tweaks-root > * { pointer-events: auto; }
</style>
</head>
<body>

<section class="fd-stage" aria-labelledby="fd-title">
  <!-- Red photo strip with thin red border -->
  <div class="fd-photos" aria-hidden="true">
    <div class="photo" style="background-image: url('../assets/photography/hero-1.jpg')"></div>
    <div class="photo" style="background-image: url('../assets/photography/hero-3.jpg')"></div>
    <div class="photo" style="background-image: url('../assets/photography/hero-6.jpg')"></div>
    <div class="photo" style="background-image: url('../assets/photography/hero-5.jpg')"></div>
    <div class="photo" style="background-image: url('../assets/photography/hero-2.jpg')"></div>
    <div class="photo" style="background-image: url('../assets/photography/hero-4.jpg')"></div>
  </div>

  <!-- Floating scalloped card.
       The SVG path draws 9 outward-bumping arcs along the top edge
       (each 78px wide, radius 39), straight right side, 9 mirrored
       arcs along the bottom, straight left side. The corner bumps
       wrap all the way to the edges. -->
  <div class="fd-card">
    <svg class="scallop" viewBox="-12 -42 724 544" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path fill="#fdf3f1"
            d="M 0 0
               a 39 39 0 0 1 78 0  a 39 39 0 0 1 78 0  a 39 39 0 0 1 78 0
               a 39 39 0 0 1 78 0  a 39 39 0 0 1 78 0  a 39 39 0 0 1 78 0
               a 39 39 0 0 1 78 0  a 39 39 0 0 1 78 0  a 39 39 0 0 1 78 0
               L 700 460
               a 39 39 0 0 1 -78 0  a 39 39 0 0 1 -78 0  a 39 39 0 0 1 -78 0
               a 39 39 0 0 1 -78 0  a 39 39 0 0 1 -78 0  a 39 39 0 0 1 -78 0
               a 39 39 0 0 1 -78 0  a 39 39 0 0 1 -78 0  a 39 39 0 0 1 -78 0
               Z"/>
    </svg>

    <div class="inner">
      <div class="fd-title-row">
        <span class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 2h2v6.6l4.7-4.7 1.4 1.4-4.7 4.7H21v2h-6.6l4.7 4.7-1.4 1.4-4.7-4.7V21h-2v-6.6l-4.7 4.7-1.4-1.4 4.7-4.7H3v-2h6.6L4.9 6.7l1.4-1.4L11 10z"/>
          </svg>
        </span>
        <h2 id="fd-title">Food &amp; Drink</h2>
        <span class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 2h2v6.6l4.7-4.7 1.4 1.4-4.7 4.7H21v2h-6.6l4.7 4.7-1.4 1.4-4.7-4.7V21h-2v-6.6l-4.7 4.7-1.4-1.4 4.7-4.7H3v-2h6.6L4.9 6.7l1.4-1.4L11 10z"/>
          </svg>
        </span>
      </div>

      <p>From espresso to espresso martinis, our menu is designed for passing plates, sharing bites, settling in, and turning one round into dinner.</p>

      <button class="btn btn-red" type="button">
        <span class="btn-label"><span>[Location] Menu</span><span>[Location] Menu</span></span>
        <span class="btn-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
    </div>
  </div>
</section>

<div id="tweaks-root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../tweaks-panel.jsx"></script>
<script type="text/babel">
  const FD_TWEAKS = /*EDITMODE-BEGIN*/{
    "cardWidth": 580,
    "titleSize": 48,
    "titleLineH": 52,
    "bodySize": 16,
    "bodyLineH": 23,
    "innerPadV": 70,
    "innerPadH": 60,
    "innerGap": 14,
    "badgeSize": 55,
    "titleGap": 24,
    "ctaSize": 18,
    "photoGap": 8,
    "photoPad": 10,
    "stagePad": 80
  }/*EDITMODE-END*/;

  function FoodDrinkTweaks() {
    const [t, setTweak] = useTweaks(FD_TWEAKS);
    React.useEffect(() => {
      const card = document.querySelector('.fd-card');
      if (card) card.style.width = `${t.cardWidth}px`;
      const inner = document.querySelector('.fd-card .inner');
      if (inner) {
        inner.style.padding = `${t.innerPadV}px ${t.innerPadH}px`;
        inner.style.gap = `${t.innerGap}px`;
      }
      const h2 = document.querySelector('.fd-card h2');
      if (h2) {
        h2.style.fontSize = `${t.titleSize}px`;
        h2.style.lineHeight = `${t.titleLineH}px`;
      }
      const p = document.querySelector('.fd-card p');
      if (p) {
        p.style.fontSize = `${t.bodySize}px`;
        p.style.lineHeight = `${t.bodyLineH}px`;
      }
      const titleRow = document.querySelector('.fd-title-row');
      if (titleRow) titleRow.style.gap = `${t.titleGap}px`;
      document.querySelectorAll('.fd-title-row .badge').forEach(b => {
        b.style.width = `${t.badgeSize}px`;
        b.style.height = `${t.badgeSize}px`;
      });
      const cta = document.querySelector('.fd-card .btn');
      if (cta) {
        cta.style.fontSize = `${t.ctaSize}px`;
      }
      const photos = document.querySelector('.fd-photos');
      if (photos) {
        photos.style.gap = `${t.photoGap}px`;
        photos.style.padding = `${t.photoPad}px`;
      }
      const stage = document.querySelector('.fd-stage');
      if (stage) stage.style.padding = `${t.stagePad}px 0`;
    }, [t]);

    return (
      <TweaksPanel title="Tweaks · food & drink">
        <TweakSection label="Card" />
        <TweakSlider label="Width"       value={t.cardWidth}  min={360} max={800} step={4} unit="px"
                     onChange={(v) => setTweak('cardWidth', v)} />
        <TweakSlider label="Inner pad V" value={t.innerPadV}  min={20}  max={100} step={2} unit="px"
                     onChange={(v) => setTweak('innerPadV', v)} />
        <TweakSlider label="Inner pad H" value={t.innerPadH}  min={20}  max={100} step={2} unit="px"
                     onChange={(v) => setTweak('innerPadH', v)} />
        <TweakSlider label="Content gap" value={t.innerGap}   min={4}   max={32}  step={1} unit="px"
                     onChange={(v) => setTweak('innerGap', v)} />

        <TweakSection label="Title" />
        <TweakSlider label="Size"        value={t.titleSize}  min={28}  max={72}  step={1} unit="px"
                     onChange={(v) => setTweak('titleSize', v)} />
        <TweakSlider label="Line height" value={t.titleLineH} min={28}  max={80}  step={1} unit="px"
                     onChange={(v) => setTweak('titleLineH', v)} />
        <TweakSlider label="Badge size"  value={t.badgeSize}  min={30}  max={80}  step={1} unit="px"
                     onChange={(v) => setTweak('badgeSize', v)} />
        <TweakSlider label="Title gap"   value={t.titleGap}   min={8}   max={48}  step={1} unit="px"
                     onChange={(v) => setTweak('titleGap', v)} />

        <TweakSection label="Body text" />
        <TweakSlider label="Size"        value={t.bodySize}   min={12}  max={24}  step={1} unit="px"
                     onChange={(v) => setTweak('bodySize', v)} />
        <TweakSlider label="Line height" value={t.bodyLineH}  min={14}  max={36}  step={1} unit="px"
                     onChange={(v) => setTweak('bodyLineH', v)} />

        <TweakSection label="CTA button" />
        <TweakSlider label="Font size" value={t.ctaSize}    min={12} max={26} step={1} unit="px"
                     onChange={(v) => setTweak('ctaSize', v)} />

        <TweakSection label="Photo strip" />
        <TweakSlider label="Gap"     value={t.photoGap} min={0}  max={20} step={1} unit="px"
                     onChange={(v) => setTweak('photoGap', v)} />
        <TweakSlider label="Padding" value={t.photoPad} min={0}  max={24} step={1} unit="px"
                     onChange={(v) => setTweak('photoPad', v)} />
        <TweakSlider label="Stage pad" value={t.stagePad} min={20} max={140} step={4} unit="px"
                     onChange={(v) => setTweak('stagePad', v)} />
      </TweaksPanel>
    );
  }
  ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<FoodDrinkTweaks />);
</script>
</body></html>
