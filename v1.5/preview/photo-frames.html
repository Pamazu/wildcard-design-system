:root {
  /* =====================================================================
     COLORS — Brand
     Order is canonical: yellow → blue → red → purple → green
     ===================================================================== */
  --wc-black:      #1b1a17;   /* off-black — primary surface for "after dark" */
  --wc-white:      #f9f0ed;   /* off-white / cream — primary surface for daytime */

  --wc-yellow:     #f5ac53;   /* PRIMARY ACCENT — orange-leaning amber */
  --wc-blue:       #4e8abe;
  --wc-red:        #ed5a35;
  --wc-purple:     #bb95ba;
  --wc-green:      #199562;

  /* Tints / shades (lifted from observed Figma usage; sparingly applied) */
  --wc-yellow-deep:  #e89a3c;   /* hover / pressed yellow */
  --wc-yellow-bright:#feca00;   /* signage yellow seen in Figma fills */
  --wc-red-deep:     #c51918;   /* deep marquee red from Figma */
  --wc-blue-deep:    #2e42a5;   /* deep navy from Figma */
  --wc-cream-soft:   #f9e8e3;   /* warm cream for sub-sections */
  --wc-cream-warm:   #f5e5e0;   /* warm tinted card surface */

  /* Functional neutrals */
  --wc-ink:        var(--wc-black);
  --wc-paper:      var(--wc-white);
  --wc-line:       rgba(27, 26, 23, 0.12);
  --wc-line-strong:rgba(27, 26, 23, 0.40);
  --wc-line-on-dark: rgba(249, 240, 237, 0.18);
  --wc-muted:      #6d6d78;

  /* =====================================================================
     SEMANTIC COLOR ROLES
     Use these in components rather than the raw brand tokens.
     ===================================================================== */
  --fg-1:          var(--wc-ink);          /* primary foreground */
  --fg-2:          rgba(27, 26, 23, 0.72); /* secondary foreground */
  --fg-3:          rgba(27, 26, 23, 0.55); /* tertiary / hint text */
  --fg-on-dark-1:  var(--wc-paper);
  --fg-on-dark-2:  rgba(249, 240, 237, 0.72);
  --fg-on-dark-3:  rgba(249, 240, 237, 0.50);

  --bg-page:       var(--wc-paper);
  --bg-page-dark:  var(--wc-black);
  --bg-card:       #ffffff;
  --bg-card-warm:  var(--wc-cream-warm);
  --bg-card-dark:  #232220;

  --accent:        var(--wc-yellow);
  --accent-fg:     var(--wc-ink);
  --danger:        var(--wc-red);
  --link:          var(--wc-blue);

  /* =====================================================================
     TYPOGRAPHY — families
     ===================================================================== */
  --font-display: 'Roc Grotesk', 'Saira', 'Arial Black', sans-serif;
  --font-body:    'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:    'SF Mono', ui-monospace, 'JetBrains Mono', monospace;

  /* Roc Grotesk Wide is already wide by design; no stretch is applied to it.
     If the Saira fallback kicks in (font fails to load), bumping this to
     125% would widen Saira to roughly match Roc's proportions. */
  --display-stretch: 100%;

  /* =====================================================================
     TYPE SCALE — desktop (Figma uses 1440px artboards)
     ===================================================================== */
  --fs-display-2xl: 100px;   /* hero titles "DRINK BOLDLY" */
  --fs-display-xl:  80px;    /* large section titles "OUR LOCATIONS" */
  --fs-display-lg:  60px;    /* sub-hero */
  --fs-display-md:  42px;    /* cards / module headers */
  --fs-display-sm:  32px;    /* inline subhead */
  --fs-display-xs:  21px;    /* eyebrow display */

  --fs-body-xl:     24px;
  --fs-body-lg:     21px;
  --fs-body-md:     18px;
  --fs-body-sm:     16px;
  --fs-body-xs:     14px;
  --fs-caption:     12px;

  /* Line heights */
  --lh-display:     1.0;
  --lh-display-loose: 1.1;
  --lh-body:        1.5;
  --lh-tight:       1.25;

  /* Letter-spacing */
  --tracking-display: 0.01em;     /* Roc Grotesk wide is already wide */
  --tracking-eyebrow: 0.08em;     /* small caps eyebrow text */
  --tracking-body:    0;

  /* =====================================================================
     SHAPE — radii, borders, shadows
     ===================================================================== */
  --radius-pill:   999px;
  --radius-xl:     50px;     /* large rounded panels per Figma */
  --radius-lg:     24px;
  --radius-md:     16px;
  --radius-sm:     8px;
  --radius-xs:     4px;

  --border-1:      1px solid var(--wc-line);
  --border-strong: 2px solid var(--wc-ink);

  /* Shadows are subtle; brand prefers flat + frame treatments */
  --shadow-1: 0 1px 2px rgba(27,26,23,0.05);
  --shadow-2: 0 6px 18px rgba(27,26,23,0.08);
  --shadow-3: 0 24px 48px rgba(27,26,23,0.18);

  /* =====================================================================
     SPACING SCALE (8px base, with 4px half-step)
     ===================================================================== */
  --sp-0:  0;
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  24px;
  --sp-6:  32px;
  --sp-7:  48px;
  --sp-8:  64px;
  --sp-9:  96px;
  --sp-10: 128px;

  /* =====================================================================
     MOTION
     ===================================================================== */
  --ease-out:    cubic-bezier(0.2, 0.6, 0.2, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-1: 120ms;
  --dur-2: 200ms;
  --dur-3: 320ms;
}

/* =====================================================================
   SEMANTIC TYPE CLASSES
   Use directly: <h1 class="wc-h1">…</h1>
   Headings use Roc Grotesk Wide; body uses Montserrat.
   ===================================================================== */

html, body {
  font-family: var(--font-body);
  font-size: var(--fs-body-sm);
  line-height: var(--lh-body);
  color: var(--fg-1);
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.wc-display, .wc-h1, .wc-h2, .wc-h3, .wc-h4, .wc-eyebrow {
  font-family: var(--font-display);
  font-weight: 500;
  font-stretch: var(--display-stretch);
  letter-spacing: var(--tracking-display);
  line-height: var(--lh-display);
  text-wrap: balance;
}

.wc-display {
  font-size: clamp(64px, 8vw, var(--fs-display-2xl));
  font-weight: 500;
  text-transform: uppercase;
}
.wc-h1 {
  font-size: clamp(48px, 6vw, var(--fs-display-xl));
  font-weight: 500;
  text-transform: uppercase;
}
.wc-h2 {
  font-size: clamp(36px, 4vw, var(--fs-display-lg));
  font-weight: 500;
  text-transform: uppercase;
}
.wc-h3 {
  font-size: var(--fs-display-md);
  font-weight: 500;
  text-transform: uppercase;
}
.wc-h4 {
  font-size: var(--fs-display-sm);
  font-weight: 500;
  text-transform: uppercase;
}
.wc-eyebrow {
  font-size: var(--fs-body-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
  font-stretch: 100%;
}

.wc-body-lg { font-size: var(--fs-body-lg); line-height: 1.5; }
.wc-body-md { font-size: var(--fs-body-md); line-height: 1.55; }
.wc-body    { font-size: var(--fs-body-sm); line-height: 1.6; }
.wc-body-sm { font-size: var(--fs-body-xs); line-height: 1.55; }
.wc-caption { font-size: var(--fs-caption); line-height: 1.4; color: var(--fg-3); }

.wc-strong  { font-weight: 700; }
.wc-mono    { font-family: var(--font-mono); }

/* =====================================================================
   DECORATIVE TYPE — "alternating letters shift up/down, accent colors"
   Per brand guideline, use sparingly on short headlines and taglines.
   Apply .wc-decorative to a heading and wrap each char in a <span>:
     <h1 class="wc-h1 wc-decorative"><span>D</span><span>R</span>…</h1>
   The CSS rotates accent colors and offsets every other letter.
   At least 1/3 of a phrase should remain plain (omit the class on
   one of the words to honor the rule).
   ===================================================================== */
.wc-decorative { display: inline-flex; flex-wrap: wrap; gap: 0.04em; }
.wc-decorative > span { display: inline-block; }
.wc-decorative > span:nth-child(odd)   { transform: translateY(-0.10em); }
.wc-decorative > span:nth-child(even)  { transform: translateY(0.10em); }
.wc-decorative > span:nth-child(5n+1)  { color: var(--wc-yellow); }
.wc-decorative > span:nth-child(5n+2)  { color: var(--wc-blue); }
.wc-decorative > span:nth-child(5n+3)  { color: var(--wc-red); }
.wc-decorative > span:nth-child(5n+4)  { color: var(--wc-purple); }
.wc-decorative > span:nth-child(5n+5)  { color: var(--wc-green); }

/* =====================================================================
   GRAIN / PAPER TEXTURE — Wildcard's "lived-in" paper finish.

   Two photographed textures power this utility:
     - Dark speckle on black (for ink / dark surfaces)
     - Cream paper with baked-in speckle (for white surfaces)

   USAGE
   -----
     <div class="wc-grain">…</div>            ← default (dark / saturated surfaces)
     <div class="wc-grain wc-grain--light">…  ← white surfaces
     <div class="wc-grain wc-grain--cream">…  ← cream / White B surfaces

   VARIABLES (override per-instance)
   ---------------------------------
     --wc-grain-opacity   how visible the grain is        [default 0.32]
     --wc-grain-blend     mix-blend-mode for the layer    [default lighten]
     --wc-grain-scale     tile size in px                 [default 600px]

  --wc-grain-blend: lighten;

}

<style>
  /* =========================================================================
     PHOTO FRAME TREATMENTS — Wildcard

     "RED STRIP" — the brand's signature photography wrap.
     A horizontal panel of Wildcard red (#ed5a35) hosts a row of photos
     with a thin red gutter between each one and equal padding around the
     whole strip. Photos sit edge-to-edge inside the red background,
     visually unified as a single brand strip rather than 6 cards.

     Photos use <image-slot> so the user can drag-and-drop their own
     imagery; drops persist via localStorage (each slot keyed by id).

     Tokens used:
       --wc-red    #ed5a35   (strip background)
     ========================================================================= */
  body {
    margin: 0;
    padding: 40px 0;
    background: var(--wc-white);
    font-family: var(--font-body);
    color: var(--fg-2);
    min-height: 100vh;
  }

  .photo-strip {
    /* Edge-to-edge red strip. Aspect ratio is set by the row's content;
       gap controls the red space showing between adjacent photos. */
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 12px;
    background: var(--wc-red);
    padding: 22px;
  }
  .photo-strip--yellow { background: var(--wc-yellow); }

  .photo-strip image-slot {
    /* Each slot is a fixed-aspect photo well; the slot component itself
       provides the drag-and-drop UI and persistence. Hard square edges,
       perfect 1:1 ratio per the brand spec.
       height: auto overrides the shadow-DOM :host default (160px) so
       aspect-ratio can drive the computed height → true 1:1 square. */
    --slot-radius: 0;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    background: rgba(0,0,0,0.18);
    border-radius: 0;
  }

  .photo-strip + .photo-strip { margin-top: 16px; }

  /* Tweaks mount */
  #tweaks-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  #tweaks-root > * { pointer-events: auto; }
</style></head>
<body>

<!-- Photo Frame Treatment — RED STRIP. Six 1:1 photo slots in a
     horizontal Wildcard-red wrap. Drag any image onto a slot to fill
     it; the slot id keys persistence so refreshes keep the picks. -->
<section class="photo-strip" aria-label="Photo strip - red">
  <image-slot id="photo-strip-red-1" placeholder="Drop a photo"></image-slot>
  <image-slot id="photo-strip-red-2" placeholder="Drop a photo"></image-slot>
  <image-slot id="photo-strip-red-3" placeholder="Drop a photo"></image-slot>
  <image-slot id="photo-strip-red-4" placeholder="Drop a photo"></image-slot>
  <image-slot id="photo-strip-red-5" placeholder="Drop a photo"></image-slot>
  <image-slot id="photo-strip-red-6" placeholder="Drop a photo"></image-slot>
</section>

<!-- Photo Frame Treatment — YELLOW STRIP. Same structure on the brand
     yellow background. -->
<section class="photo-strip photo-strip--yellow" aria-label="Photo strip - yellow">
  <image-slot id="photo-strip-yellow-1" placeholder="Drop a photo"></image-slot>
  <image-slot id="photo-strip-yellow-2" placeholder="Drop a photo"></image-slot>
  <image-slot id="photo-strip-yellow-3" placeholder="Drop a photo"></image-slot>

<script type="text/babel">
  const PF_TWEAKS = /*EDITMODE-BEGIN*/{
    "stripGap": 12,
    "stripPad": 22,
    "stripSpacing": 16,
    "pagePad": 40
  }/*EDITMODE-END*/;

  function PhotoFrameTweaks() {
    const [t, setTweak] = useTweaks(PF_TWEAKS);
    React.useEffect(() => {
      document.querySelectorAll('.photo-strip').forEach(strip => {
        strip.style.gap = `${t.stripGap}px`;
        strip.style.padding = `${t.stripPad}px`;
      });
      document.querySelectorAll('.photo-strip + .photo-strip').forEach(strip => {
        strip.style.marginTop = `${t.stripSpacing}px`;
      });
      document.body.style.padding = `${t.pagePad}px 0`;
    }, [t]);

    return (
      <TweaksPanel title="Tweaks · photo frames">
        <TweakSection label="Strip" />
        <TweakSlider label="Photo gap"     value={t.stripGap}     min={0}  max={32} step={1} unit="px"
                     onChange={(v) => setTweak('stripGap', v)} />
        <TweakSlider label="Strip padding" value={t.stripPad}     min={0}  max={48} step={1} unit="px"
                     onChange={(v) => setTweak('stripPad', v)} />
        <TweakSlider label="Strip spacing" value={t.stripSpacing} min={0}  max={48} step={1} unit="px"
                     onChange={(v) => setTweak('stripSpacing', v)} />

        <TweakSection label="Page" />
        <TweakSlider label="Page pad"      value={t.pagePad}      min={0}  max={80} step={4} unit="px"
                     onChange={(v) => setTweak('pagePad', v)} />
      </TweaksPanel>
    );
  }
  ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<PhotoFrameTweaks />);
</script>
</body></html>
