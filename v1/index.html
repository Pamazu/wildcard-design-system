<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wildcard Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sidebar-w: 300px;
  --topbar-h: 52px;
  --off-black: #1b1a17;
  --cream: #f9f0ed;
  --cream-dim: #b8aea8;
  --yellow: #f5ac53;
  --yellow-hover: #f7bf76;
  --green: #5cb85c;
  --red: #e74c3c;
  --blue: #3d9be9;
  --sidebar-hover: rgba(245, 172, 83, 0.08);
  --sidebar-active: rgba(245, 172, 83, 0.14);
  --transition: 180ms ease;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--off-black);
  color: var(--cream);
  display: flex;
  flex-direction: column;
}

/* ── Top Bar ── */
.topbar {
  height: var(--topbar-h);
  background: var(--off-black);
  border-bottom: 1px solid rgba(249,240,237,0.08);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 20;
}
.topbar-brand {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--cream);
  white-space: nowrap;
}
.topbar-sep {
  width: 1px;
  height: 18px;
  background: rgba(249,240,237,0.18);
}
.topbar-current {
  font-weight: 500;
  font-size: 13px;
  color: var(--yellow);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hamburger {
  display: none;
  background: none;
  border: none;
  color: var(--cream);
  cursor: pointer;
  padding: 4px;
  margin-right: 4px;
}
.hamburger svg { display: block; }

/* ── Layout ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--off-black);
  border-right: 1px solid rgba(249,240,237,0.08);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform var(--transition);
  z-index: 10;
}
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 20px;
  scrollbar-width: thin;
  scrollbar-color: rgba(249,240,237,0.15) transparent;
}
.sidebar-scroll::-webkit-scrollbar { width: 5px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(249,240,237,0.15); border-radius: 3px; }

/* ── Categories ── */
.cat {
  margin-bottom: 2px;
}
.cat-header {
  display: flex;
  align-items: center;
  padding: 9px 16px 9px 14px;
  cursor: pointer;
  user-select: none;
  transition: background var(--transition);
  border-radius: 0;
}
.cat-header:hover { background: var(--sidebar-hover); }
.cat-chevron {
  width: 16px;
  height: 16px;
  margin-right: 6px;
  flex-shrink: 0;
  transition: transform var(--transition);
  color: var(--cream-dim);
  transform: rotate(90deg);
}
.cat.collapsed .cat-chevron { transform: rotate(0deg); }
.cat-label {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cream-dim);
  flex: 1;
}
.cat-count {
  font-size: 10px;
  font-weight: 600;
  color: var(--cream-dim);
  background: rgba(249,240,237,0.07);
  padding: 1px 7px;
  border-radius: 8px;
  margin-left: 8px;
}
.cat-items {
  overflow: hidden;
  transition: max-height 250ms ease;
}
.cat.collapsed .cat-items { max-height: 0 !important; }

/* ── Sub-categories ── */
.subcat-header {
  display: flex;
  align-items: center;
  padding: 6px 16px 6px 36px;
  cursor: pointer;
  user-select: none;
  transition: background var(--transition);
}
.subcat-header:hover { background: var(--sidebar-hover); }
.subcat-chevron {
  width: 14px;
  height: 14px;
  margin-right: 5px;
  flex-shrink: 0;
  transition: transform var(--transition);
  color: var(--cream-dim);
  transform: rotate(90deg);
}
.subcat.collapsed .subcat-chevron { transform: rotate(0deg); }
.subcat-label {
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.03em;
  color: var(--cream-dim);
  flex: 1;
}
.subcat-items {
  overflow: hidden;
  transition: max-height 250ms ease;
}
.subcat.collapsed .subcat-items { max-height: 0 !important; }

/* ── Items ── */
.item {
  display: flex;
  align-items: center;
  padding: 7px 16px 7px 28px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  font-size: 13px;
  font-weight: 500;
  color: var(--cream);
  user-select: none;
  outline: none;
}
.item.nested { padding-left: 50px; }
.item:hover { background: var(--sidebar-hover); }
.item:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: -2px;
}
.item.active {
  background: var(--sidebar-active);
  color: var(--yellow);
}
.item-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Sidebar Status Indicators ── */
.status-indicator {
  width: 14px;
  height: 14px;
  margin-left: 8px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Pending — blue dot */
.status-indicator[data-status="new"]::after {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--blue);
}
/* Needs work — red/coral dot */
.status-indicator[data-status="needs-work"]::after {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e8625c;
}
/* Approved — green circle with white checkmark */
.status-indicator[data-status="looks-good"] {
  width: 14px;
  height: 14px;
  background: var(--green);
  border-radius: 50%;
}
.status-indicator[data-status="looks-good"] svg {
  display: block;
  width: 10px;
  height: 10px;
  color: #fff;
}
.status-indicator[data-status="new"] svg,
.status-indicator[data-status="needs-work"] svg { display: none; }

/* ── Approval Buttons (top bar) ── */
.approval-group {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  flex-shrink: 0;
}
.approval-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 16px;
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
  white-space: nowrap;
  height: 28px;
  border: 1.5px solid transparent;
}
.approval-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

/* Looks good — neutral light style */
.btn-looks-good {
  background: rgba(249,240,237,0.10);
  color: var(--cream);
  border-color: rgba(249,240,237,0.20);
}
.btn-looks-good:hover {
  background: rgba(249,240,237,0.16);
  border-color: rgba(249,240,237,0.30);
}
.btn-looks-good.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.btn-looks-good.active:hover {
  background: #4ea84e;
  border-color: #4ea84e;
}

/* Needs work — coral/red outline */
.btn-needs-work {
  background: transparent;
  color: #e8625c;
  border-color: rgba(232,98,92,0.4);
}
.btn-needs-work:hover {
  background: rgba(232,98,92,0.08);
  border-color: rgba(232,98,92,0.6);
}
.btn-needs-work.active {
  background: #e8625c;
  color: #fff;
  border-color: #e8625c;
}
.btn-needs-work.active:hover {
  background: #d4524c;
  border-color: #d4524c;
}

/* Separator between approval and tweaks */
.topbar-sep-light {
  width: 1px;
  height: 18px;
  background: rgba(249,240,237,0.10);
}

/* ── Progress Counter ── */
.progress-counter {
  padding: 10px 16px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--cream-dim);
  letter-spacing: 0.03em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.progress-bar-track {
  flex: 1;
  height: 3px;
  background: rgba(249,240,237,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 300ms ease;
}

/* ── Comment Bar ── */
.comment-bar {
  background: #2a2520;
  border-bottom: 1px solid rgba(249,240,237,0.06);
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 200ms ease, padding 200ms ease;
  flex-shrink: 0;
  z-index: 19;
}
.comment-bar.open {
  max-height: 120px;
  padding: 10px 20px;
}
.comment-inner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 680px;
  margin-left: calc(var(--sidebar-w) + 20px);
}
.comment-inner textarea {
  flex: 1;
  min-height: 32px;
  max-height: 72px;
  resize: none;
  background: rgba(249,240,237,0.07);
  border: 1px solid rgba(232,98,92,0.3);
  border-radius: 10px;
  padding: 7px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--cream);
  outline: none;
  transition: border-color var(--transition);
}
.comment-inner textarea::placeholder { color: rgba(249,240,237,0.35); }
.comment-inner textarea:focus { border-color: rgba(232,98,92,0.6); }
.comment-save {
  height: 32px;
  padding: 0 14px;
  border-radius: 8px;
  border: none;
  background: #e8625c;
  color: #fff;
  font-family: inherit;
  font-weight: 600;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background var(--transition);
}
.comment-save:hover { background: #d4524c; }
.comment-dismiss {
  height: 32px;
  width: 32px;
  border-radius: 8px;
  border: none;
  background: rgba(249,240,237,0.07);
  color: var(--cream-dim);
  font-size: 14px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition);
}
.comment-dismiss:hover { background: rgba(249,240,237,0.14); }

/* Comment display (read-only, shown when component has a saved comment) */
.comment-display {
  background: #2a2520;
  border-bottom: 1px solid rgba(249,240,237,0.06);
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 200ms ease, padding 200ms ease;
  flex-shrink: 0;
  z-index: 18;
}
.comment-display.visible {
  max-height: 80px;
  padding: 8px 20px;
}
.comment-display-inner {
  margin-left: calc(var(--sidebar-w) + 20px);
  max-width: 680px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.comment-display-icon {
  color: #e8625c;
  flex-shrink: 0;
  width: 14px;
  height: 14px;
}
.comment-display-text {
  font-size: 12px;
  font-weight: 500;
  color: rgba(249,240,237,0.7);
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* Sidebar comment bubble icon */
.comment-icon {
  width: 12px;
  height: 12px;
  margin-left: 4px;
  flex-shrink: 0;
  color: #e8625c;
  opacity: 0.7;
}

@media (max-width: 768px) {
  .comment-inner,
  .comment-display-inner { margin-left: 20px; }
}

/* ── Tweaks Button ── */
.tweaks-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--yellow);
  background: transparent;
  color: var(--yellow);
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), opacity var(--transition), border-color var(--transition);
  white-space: nowrap;
  flex-shrink: 0;
}
.tweaks-btn:hover:not(:disabled) { background: rgba(245,172,83,0.12); }
.tweaks-btn.active {
  background: var(--yellow);
  color: var(--off-black);
}
.tweaks-btn.active:hover { background: var(--yellow-hover); }
.tweaks-btn:disabled {
  border-color: rgba(249,240,237,0.18);
  color: var(--cream-dim);
  cursor: default;
  opacity: 0.5;
}
.tweaks-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ── Tweaks icon in sidebar ── */
.tweaks-icon {
  width: 13px;
  height: 13px;
  margin-left: 6px;
  flex-shrink: 0;
  color: var(--cream-dim);
  opacity: 0.55;
}
.item.active .tweaks-icon { color: var(--yellow); opacity: 0.8; }

/* ── Edit Mode ── */
.edit-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--yellow);
  background: transparent;
  color: var(--yellow);
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
  white-space: nowrap;
  flex-shrink: 0;
  height: 28px;
}
.edit-btn:hover:not(.active) { background: rgba(245,172,83,0.12); }
.edit-btn.active { background: var(--yellow); color: var(--off-black); }
.edit-btn.active:hover { background: var(--yellow-hover); }
.edit-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

.edit-save-btn {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 4px 14px;
  border-radius: 16px;
  border: 1.5px solid var(--green);
  background: transparent;
  color: var(--green);
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
  white-space: nowrap;
  flex-shrink: 0;
  height: 28px;
}
.edit-save-btn.visible { display: inline-flex; }
.edit-save-btn:hover:not(.saving):not(.saved) { background: rgba(92,184,92,0.12); }
.edit-save-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.edit-save-btn.saving { opacity: 0.6; cursor: default; }
.edit-save-btn.saved {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}

.edit-hover-overlay, .edit-select-overlay {
  position: fixed;
  pointer-events: none;
  display: none;
}
.edit-hover-overlay {
  z-index: 1000;
  border: 2px solid #4A90D9;
  background: rgba(74,144,217,0.08);
}
.edit-select-overlay {
  z-index: 999;
  border: 2px solid #f5ac53;
  background: rgba(245,172,83,0.06);
}
.edit-tooltip {
  position: fixed;
  pointer-events: none;
  z-index: 1001;
  background: rgba(27,26,23,0.92);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
  display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.edit-panel {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--off-black);
  border-right: 1px solid rgba(249,240,237,0.08);
  z-index: 15;
  overflow-y: auto;
  transform: translateX(-100%);
  transition: transform 200ms ease;
  scrollbar-width: thin;
  scrollbar-color: rgba(249,240,237,0.15) transparent;
}
.edit-panel::-webkit-scrollbar { width: 5px; }
.edit-panel::-webkit-scrollbar-track { background: transparent; }
.edit-panel::-webkit-scrollbar-thumb { background: rgba(249,240,237,0.15); border-radius: 3px; }
.edit-panel.open { transform: translateX(0); }
.edit-panel-header {
  padding: 12px 16px 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--yellow);
  border-bottom: 1px solid rgba(249,240,237,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.edit-panel-close {
  background: none;
  border: none;
  color: var(--cream-dim);
  cursor: pointer;
  padding: 2px 6px;
  font-size: 14px;
  border-radius: 4px;
  transition: background var(--transition);
}
.edit-panel-close:hover { background: rgba(249,240,237,0.1); }
.edit-section { padding: 10px 16px 6px; }
.edit-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cream-dim);
  margin-bottom: 8px;
}
.edit-row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
  gap: 6px;
}
.edit-row-label {
  width: 70px;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 500;
  color: rgba(249,240,237,0.55);
}
.edit-row-input {
  flex: 1;
  min-width: 0;
  height: 26px;
  background: rgba(249,240,237,0.07);
  border: 1px solid rgba(249,240,237,0.12);
  border-radius: 5px;
  padding: 0 8px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  color: var(--cream);
  outline: none;
  transition: border-color var(--transition);
}
.edit-row-input:focus { border-color: var(--yellow); }
.edit-row-input[type="number"] { width: 56px; flex: 0 0 56px; }
.edit-row-unit {
  font-size: 10px;
  color: var(--cream-dim);
  flex-shrink: 0;
}
.edit-row-select {
  flex: 1;
  height: 26px;
  background: rgba(249,240,237,0.07);
  border: 1px solid rgba(249,240,237,0.12);
  border-radius: 5px;
  padding: 0 6px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  color: var(--cream);
  outline: none;
  cursor: pointer;
}
.edit-row-select:focus { border-color: var(--yellow); }
.edit-row-color {
  width: 26px;
  height: 26px;
  border: 1px solid rgba(249,240,237,0.12);
  border-radius: 5px;
  padding: 2px;
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
}
.edit-row-hex {
  font-size: 11px;
  font-weight: 500;
  color: var(--cream);
}
.edit-segmented { display: flex; gap: 0; flex: 1; }
.edit-seg-btn {
  flex: 1;
  height: 26px;
  background: rgba(249,240,237,0.07);
  border: 1px solid rgba(249,240,237,0.12);
  color: var(--cream-dim);
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
}
.edit-seg-btn:first-child { border-radius: 5px 0 0 5px; }
.edit-seg-btn:last-child { border-radius: 0 5px 5px 0; }
.edit-seg-btn.active {
  background: var(--yellow);
  color: var(--off-black);
  border-color: var(--yellow);
}
.edit-dim-unit {
  width: 56px;
  flex-shrink: 0;
  height: 26px;
  background: rgba(249,240,237,0.07);
  border: 1px solid rgba(249,240,237,0.12);
  border-radius: 5px;
  padding: 0 2px;
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  color: var(--cream-dim);
  outline: none;
  cursor: pointer;
}
.edit-dim-unit:focus { border-color: var(--yellow); }
.edit-sides-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  flex: 1;
}
.edit-sides-field {
  display: flex;
  align-items: center;
  gap: 3px;
}
.edit-sides-label {
  font-size: 10px;
  font-weight: 600;
  color: rgba(249,240,237,0.4);
  width: 12px;
  flex-shrink: 0;
  text-align: center;
}
.edit-sides-field .edit-row-input[type="number"] {
  width: 44px;
  flex: 1;
  padding: 0 4px;
}

/* ── Comment Mode ── */
.comment-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid #e8625c;
  background: transparent;
  color: #e8625c;
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  white-space: nowrap;
  flex-shrink: 0;
  height: 28px;
}

// Normalize old plain-string entries → object
Object.keys(statusMap).forEach(k => {
  if (typeof statusMap[k] === 'string') {
    statusMap[k] = { status: statusMap[k] };
  }
});

function getStatus(id) {
  const entry = statusMap[id];
  if (!entry) return 'new';
  return (typeof entry === 'object') ? (entry.status || 'new') : entry;
}
function getComment(id) {
  const entry = statusMap[id];
  if (!entry || typeof entry !== 'object') return '';
  return entry.comment || '';
}
function saveState() {
  localStorage.setItem('wc-ds-status', JSON.stringify(statusMap));
}
function setStatus(id, status, comment) {
  if (!statusMap[id] || typeof statusMap[id] !== 'object') statusMap[id] = {};
  statusMap[id].status = status;
  if (comment !== undefined) statusMap[id].comment = comment;
  // Clear comment when approving or resetting to new
  if (status !== 'needs-work') statusMap[id].comment = '';
  saveState();
  // Update sidebar indicator
  const indicator = document.querySelector(`.status-indicator[data-id="${id}"]`);
  if (indicator) {
    indicator.dataset.status = status;
    indicator.setAttribute('aria-label', 'Status: ' + status);
  }
  // Update sidebar comment icon
  updateCommentIcon(id);
  updateProgress();
  syncApprovalButtons();
  syncCommentDisplay();
  // Route "needs-work" comments to server
  if (status === 'needs-work' && comment) {
    const item = allItems.find(el => el.dataset.id === id);
    const name = item ? item.querySelector('.item-label').textContent : id;
    fetch('/api/comment', {
      method: 'POST',

      body: JSON.stringify({ component: id, componentName: name, text: comment, type: 'needs-work', area: null, timestamp: new Date().toISOString(), screenshot: null }),
    }).catch(() => {});
  }
}
function setComment(id, comment) {
  if (!statusMap[id] || typeof statusMap[id] !== 'object') statusMap[id] = { status: 'needs-work' };
  statusMap[id].comment = comment;
  saveState();
  updateCommentIcon(id);
  syncCommentDisplay();
}

// ── Tweaks persistence ──
let pendingTweakEdits = {};
let _tweakSaveTimer = null;

async function savePendingTweaks() {
  if (!activeId || !Object.keys(pendingTweakEdits).length) return;
  const item = allItems.find(el => el.dataset.id === activeId);
  if (!item) return;
  const filePath = item.dataset.src;
  try {
    const resp = await fetch('/' + filePath);
    let source = await resp.text();
    // Find ALL non-commented EDITMODE pairs and update each of them.
    // pages-home.html has THREE real blocks (compiled JS x2 + Babel JSX
    // source). Updating only one creates an inconsistency where one mount
    // sees fresh defaults but Babel re-compiles the stale source and
    // overrides them. Skip commented USAGE EXAMPLE blocks (preceded by
    // `//` on the same line) per #77 root cause.
    const re = /\/\*EDITMODE-BEGIN\*\/([\s\S]*?)\/\*EDITMODE-END\*\//g;
    const realMatches = [];
    for (const candidate of source.matchAll(re)) {
      const lineStart = source.lastIndexOf('\n', candidate.index) + 1;
      const lineUntilMatch = source.slice(lineStart, candidate.index);
      if (!/\/\//.test(lineUntilMatch)) realMatches.push(candidate);
    }
    if (!realMatches.length) { console.warn('No non-commented EDITMODE block found in', filePath); return; }
    const defaults = JSON.parse(realMatches[0][1]);
    Object.assign(defaults, pendingTweakEdits);
    const json = JSON.stringify(defaults, null, 4);
    const replacement = '/*EDITMODE-BEGIN*/' + json + '/*EDITMODE-END*/';
    // Apply in reverse order so earlier match indices stay valid.
    for (let i = realMatches.length - 1; i >= 0; i--) {
      const m = realMatches[i];
      source = source.slice(0, m.index) + replacement + source.slice(m.index + m[0].length);
    }
    const saveResp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: filePath, content: source }),
    });
    const data = await saveResp.json();
    if (data.ok) console.log('Tweaks saved to', filePath);
    else console.warn('Tweaks save failed:', data.error);
  } catch (e) { console.warn('Tweaks save error:', e); }
  pendingTweakEdits = {};
}

// Listen for messages from iframe

  if (!e.data || !e.data.type) return;
  switch (e.data.type) {
    case '__edit_mode_available':
      tweaksAvailable = true;
      tweaksBtn.disabled = false;
      tweaksBtn.title = 'Toggle tweaks panel';
      break;
    case '__edit_mode_dismissed':
      setTweaksActive(false);
      savePendingTweaks();
      break;
    case '__edit_mode_set_keys': {
      const edits = e.data.edits;
      if (edits) Object.assign(pendingTweakEdits, edits);
      clearTimeout(_tweakSaveTimer);
      _tweakSaveTimer = setTimeout(() => savePendingTweaks(), 500);
      break;
    }
  }
});

function selectItem(id) {
  if (activeId === id) return;

  // Exit edit/comment/inspect mode on component switch
  if (editActive) exitEditMode();
  if (cmtMode) toggleCommentMode();
  if (typeof inspectActive !== 'undefined' && inspectActive) exitInspectMode();

  // Reset tweaks before switching
  resetTweaks();

  activeId = id;

  allItems.forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  const item = allItems.find(el => el.dataset.id === id);
  if (!item) return;

  // Use ? or & depending on whether the src already has query params (e.g. iframe.html?component=X).
  frame.src = item.dataset.src + (item.dataset.src.includes('?') ? '&' : '?') + 't=' + Date.now();
  topCurrent.textContent = item.querySelector('.item-label').textContent;
  location.hash = id;

  // Ensure visible — expand parent categories if collapsed
  let parent = item.parentElement;
  while (parent && parent !== scroll) {
    if (parent.classList.contains('cat') && parent.classList.contains('collapsed')) {
      parent.classList.remove('collapsed');
    }
    if (parent.classList.contains('subcat') && parent.classList.contains('collapsed')) {
      parent.classList.remove('collapsed');
    }
    parent = parent.parentElement;
  }

  // Close comment bar from previous item
  closeCommentBar();

  // Sync approval buttons + comment display to this item's status
  syncApprovalButtons();
  syncCommentDisplay();

  // Close mobile sidebar
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
}

  commentBar.classList.remove('open');
  commentInput.value = '';
  syncCommentDisplay();
}

function saveComment() {
  if (!activeId) return;
  const text = commentInput.value.trim();
  if (text) {
    setStatus(activeId, 'needs-work', text);
  } else {
    // No text → still mark needs-work but no comment
    setStatus(activeId, 'needs-work', '');
  }
  closeCommentBar();
}

function syncCommentDisplay() {
  if (!activeId) return;
  const comment = getComment(activeId);
  const status = getStatus(activeId);
  if (comment && status === 'needs-work' && !commentBar.classList.contains('open')) {
    commentDisplayText.textContent = comment;
    commentDisplay.classList.add('visible');
  } else {
    commentDisplay.classList.remove('visible');
  }
}

      setStatus(activeId, 'new');

function rgb2hex(c) {
  const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  return m ? '#' + [m[1],m[2],m[3]].map(n => (+n).toString(16).padStart(2,'0')).join('') : c;
}
function editPxVal(v) { return Math.round(parseFloat(v)) || 0; }
function editIframeOff() { const r = frame.getBoundingClientRect(); return { t: r.top, l: r.left }; }
function editPlaceOvl(o, rect, f) {
  o.style.display = 'block';
  o.style.top = (f.t + rect.top) + 'px';
  o.style.left = (f.l + rect.left) + 'px';
  o.style.width = rect.width + 'px';

function exitEditMode() {

function clearEditState() {

  editPanel.classList.remove('open');

function bindEditIframe() {
  const tryBind = () => {
    try {
      const d = frame.contentDocument;
      if (!d || !d.body) { setTimeout(tryBind, 100); return; }
      d.addEventListener('mousemove', onEditMove);
      d.addEventListener('click', onEditClick);
      d.addEventListener('dblclick', onEditDbl);
      d.addEventListener('mouseleave', onEditLeave);
      frame.contentWindow.addEventListener('scroll', onEditScroll);
    } catch(e) { setTimeout(tryBind, 100); }
  };
  tryBind();
}

function unbindEditIframe() {
  try {
    const d = frame.contentDocument;
    if (!d) return;
    d.removeEventListener('mousemove', onEditMove);
    d.removeEventListener('click', onEditClick);
    d.removeEventListener('dblclick', onEditDbl);
    d.removeEventListener('mouseleave', onEditLeave);
    frame.contentWindow.removeEventListener('scroll', onEditScroll);
  } catch(e) {}
}

function onEditMove(e) {
  if (!editActive || editInlineEl) return;
  const d = frame.contentDocument;
  const el = d.elementFromPoint(e.clientX, e.clientY);
  if (!el || el === d.documentElement || el === d.body) {
    hoverOvl.style.display = editTooltip.style.display = 'none';
    return;
  }
  if (el === editSelectedEl) {
    hoverOvl.style.display = editTooltip.style.display = 'none';
    return;
  }
  const rect = el.getBoundingClientRect();
  const f = editIframeOff();
  editPlaceOvl(hoverOvl, rect, f);
  const tag = el.tagName.toLowerCase();
  editTooltip.textContent = tag + ' · ' + Math.round(rect.width) + ' × ' + Math.round(rect.height);
  editTooltip.style.display = 'block';
  let ttTop = f.t + rect.top - 26;
  if (ttTop < f.t) ttTop = f.t + rect.bottom + 4;
  editTooltip.style.top = ttTop + 'px';
  editTooltip.style.left = (f.l + rect.left) + 'px';
}

function onEditLeave() {
  hoverOvl.style.display = editTooltip.style.display = 'none';
}

function onEditClick(e) {
  if (!editActive || editInlineEl) return;
  e.preventDefault();
  e.stopPropagation();
  const d = frame.contentDocument;
  const el = d.elementFromPoint(e.clientX, e.clientY);
  if (!el || el === d.documentElement || el === d.body) return;
  if (el === editSelectedEl) return;
  editSelectedEl = el;
  editPlaceOvl(selOvl, el.getBoundingClientRect(), editIframeOff());
  hoverOvl.style.display = editTooltip.style.display = 'none';
  buildEditPanel(el);
  editPanel.classList.add('open');
}

function onEditDbl(e) {
  if (!editActive) return;
  const d = frame.contentDocument;
  const el = d.elementFromPoint(e.clientX, e.clientY);
  if (!el || !EDIT_TEXT_TAGS.has(el.tagName)) return;
  e.preventDefault();
  e.stopPropagation();
  startEditInline(el);
}

function onEditScroll() {
  if (editSelectedEl) {
    editPlaceOvl(selOvl, editSelectedEl.getBoundingClientRect(), editIframeOff());
  }
}

function startEditInline(el) {
  editInlineEl = el;
  el.contentEditable = 'plaintext-only';
  if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
  el.focus();
  const s = frame.contentWindow.getSelection();
  const r = frame.contentDocument.createRange();
  r.selectNodeContents(el);
  s.removeAllRanges();
  s.addRange(r);
  el._eBlur = () => exitEditInline();
  el._eKey = (ev) => { if (ev.key === 'Escape') { ev.preventDefault(); el.blur(); } };
  el.addEventListener('blur', el._eBlur);
  el.addEventListener('keydown', el._eKey);
}

function exitEditInline() {
  if (!editInlineEl) return;
  editInlineEl.contentEditable = 'false';
  if (editInlineEl._eBlur) editInlineEl.removeEventListener('blur', editInlineEl._eBlur);
  if (editInlineEl._eKey) editInlineEl.removeEventListener('keydown', editInlineEl._eKey);
  editInlineEl = null;
}

function buildEditPanel(el) {
  const cs = frame.contentWindow.getComputedStyle(el);
  editPanel.innerHTML = '';
  const hdr = document.createElement('div');
  hdr.className = 'edit-panel-header';
  const tagSpan = document.createElement('span');
  tagSpan.textContent = el.tagName.toLowerCase();
  hdr.appendChild(tagSpan);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'edit-panel-close';
  closeBtn.textContent = '✕';
  closeBtn.onclick = () => {
    editPanel.classList.remove('open');
    editSelectedEl = null;
    selOvl.style.display = 'none';
  };
  hdr.appendChild(closeBtn);
  editPanel.appendChild(hdr);

  EDIT_SECTIONS.forEach(sec => {
    const div = document.createElement('div');
    div.className = 'edit-section';
    const title = document.createElement('div');
    title.className = 'edit-section-title';
    title.textContent = sec.title;
    div.appendChild(title);
    sec.props.forEach(p => div.appendChild(makeEditRow(p, el, cs)));
    editPanel.appendChild(div);
  });
}

function makeEditRow(p, el, cs) {
  const row = document.createElement('div');
  row.className = 'edit-row';
  const lbl = document.createElement('span');
  lbl.className = 'edit-row-label';
  lbl.textContent = p.label;
  row.appendChild(lbl);

  const apply = (prop, val) => {
    el.style.setProperty(prop, val);
    if (editSelectedEl === el) editPlaceOvl(selOvl, el.getBoundingClientRect(), editIframeOff());
  };

  switch (p.type) {
    case 'text': {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'edit-row-input';
      inp.value = cs.getPropertyValue(p.css).trim();
      inp.oninput = () => apply(p.css, inp.value);
      row.appendChild(inp);
      break;
    }
    case 'num': {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.className = 'edit-row-input';
      const raw = cs.getPropertyValue(p.css).trim();
      const isNone = p.noneVal && (raw === 'none' || raw === '');
      inp.value = isNone ? '' : (p.scale ? Math.round(parseFloat(raw) * p.scale) : editPxVal(raw));
      if (isNone) inp.placeholder = 'none';
      inp.oninput = () => {
        const v = parseFloat(inp.value);
        if (isNaN(v)) { if (p.noneVal) apply(p.css, 'none'); return; }
        if (p.scale) apply(p.css, String(v / p.scale));
        else apply(p.setCss || p.css, v + (p.unit || ''));
      };
      row.appendChild(inp);
      if (p.unit) {
        const u = document.createElement('span');
        u.className = 'edit-row-unit';
        u.textContent = p.unit;
        row.appendChild(u);
      }
      break;
    }
    case 'sel': {
      const sel = document.createElement('select');
      sel.className = 'edit-row-select';
      const cur = cs.getPropertyValue(p.css).trim();
      p.opts.forEach(v => {
        const op = document.createElement('option');
        op.value = v;
        op.textContent = v;
        if (v === cur) op.selected = true;
        sel.appendChild(op);
      });
      sel.onchange = () => apply(p.css, sel.value);
      row.appendChild(sel);
      break;
    }
    case 'clr': {
      const raw = cs.getPropertyValue(p.css);
      const hex = rgb2hex(raw);
      const ci = document.createElement('input');
      ci.type = 'color';
      ci.className = 'edit-row-color';
      ci.value = hex.length === 7 && hex.startsWith('#') ? hex : '#000000';
      const hl = document.createElement('span');
      hl.className = 'edit-row-hex';
      hl.textContent = hex;
      ci.oninput = () => { apply(p.css, ci.value); hl.textContent = ci.value; };
      row.appendChild(ci);
      row.appendChild(hl);
      break;
    }
    case 'dim': {
      const raw = cs.getPropertyValue(p.css).trim();
      const isNone = raw === 'none';
      const isAuto = raw === 'auto';
      const isPct = raw.endsWith('%');
      const pxVal = parseFloat(raw);
      let curUnit = isNone ? 'none' : isAuto ? 'auto' : isPct ? '%' : 'px';
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.className = 'edit-row-input';
      inp.value = (curUnit === 'auto' || curUnit === 'none') ? '' : (isPct ? parseFloat(raw) : Math.round(pxVal) || 0);
      if (curUnit === 'auto') inp.placeholder = 'auto';
      if (curUnit === 'none') inp.placeholder = 'none';
      if (curUnit === 'auto' || curUnit === 'none') inp.disabled = true;
      const unitSel = document.createElement('select');
      unitSel.className = 'edit-dim-unit';
      const units = p.allowNone ? ['px','%','auto','fit','none'] : ['px','%','auto','fit'];
      units.forEach(u => {
        const op = document.createElement('option');
        op.value = u;
        op.textContent = u === 'fit' ? 'fit' : u;
        if (u === curUnit) op.selected = true;
        unitSel.appendChild(op);
      });
      const applyDim = () => {
        const u = unitSel.value;
        if (u === 'auto') { apply(p.css, 'auto'); inp.disabled = true; inp.value = ''; inp.placeholder = 'auto'; }
        else if (u === 'none') { apply(p.css, 'none'); inp.disabled = true; inp.value = ''; inp.placeholder = 'none'; }
        else if (u === 'fit') { apply(p.css, 'fit-content'); inp.disabled = true; inp.value = ''; inp.placeholder = 'fit'; }
        else { inp.disabled = false; inp.placeholder = ''; const v = parseFloat(inp.value); if (!isNaN(v)) apply(p.css, v + u); }
      };
      inp.oninput = applyDim;
      unitSel.onchange = applyDim;
      row.appendChild(inp);
      row.appendChild(unitSel);
      break;
    }
    case 'seg': {
      const wrap = document.createElement('div');
      wrap.className = 'edit-segmented';
      const cur = cs.getPropertyValue(p.css).trim();
      p.opts.forEach(v => {
        const b = document.createElement('button');
        b.className = 'edit-seg-btn' + (v === cur ? ' active' : '');
        b.textContent = v.charAt(0).toUpperCase();
        b.onclick = () => {
          wrap.querySelectorAll('.edit-seg-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          apply(p.css, v);
        };
        wrap.appendChild(b);
      });
      row.appendChild(wrap);
      break;
    }
    case 'sides': {
      const sides = [
        { label: 'T', sfx: '-top' },
        { label: 'R', sfx: '-right' },
        { label: 'B', sfx: '-bottom' },
        { label: 'L', sfx: '-left' },
      ];
      const grid = document.createElement('div');
      grid.className = 'edit-sides-grid';
      sides.forEach(s => {
        const field = document.createElement('div');
        field.className = 'edit-sides-field';
        const fl = document.createElement('span');
        fl.className = 'edit-sides-label';
        fl.textContent = s.label;
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.className = 'edit-row-input';
        inp.value = editPxVal(cs.getPropertyValue(p.css + s.sfx));
        inp.oninput = () => { const v = parseFloat(inp.value); if (!isNaN(v)) apply(p.css + s.sfx, v + 'px'); };
        const u = document.createElement('span');
        u.className = 'edit-row-unit';
        u.textContent = 'px';
        field.appendChild(fl);
        field.appendChild(inp);
        field.appendChild(u);
        grid.appendChild(field);
      });
      row.appendChild(grid);
      break;
    }
  }
  return row;
}

// ── Save to disk ──
const editSaveBtn = document.getElementById('edit-save-btn');
const SAVE_ICON = editSaveBtn.innerHTML;

async function saveEditChanges() {
  if (!activeId || editSaveBtn.classList.contains('saving')) return;
  const item = allItems.find(el => el.dataset.id === activeId);
  if (!item) return;
  const filePath = item.dataset.src;
  try {
    const doc = frame.contentDocument;
    const dt = doc.doctype;
    const doctype = dt ? '<!doctype ' + dt.name + '>\n' : '<!doctype html>\n';
    const html = doctype + doc.documentElement.outerHTML + '\n';
    editSaveBtn.classList.add('saving');
    editSaveBtn.textContent = 'Saving…';
    const resp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: filePath, content: html }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Save failed');
    editSaveBtn.classList.remove('saving');
    editSaveBtn.classList.add('saved');
    editSaveBtn.innerHTML = '✓ Saved';
    setTimeout(() => { editSaveBtn.classList.remove('saved'); editSaveBtn.innerHTML = SAVE_ICON; }, 2000);
  } catch (e) {
    editSaveBtn.classList.remove('saving');
    editSaveBtn.innerHTML = '✗ Error';
    console.error('Save failed:', e);
    setTimeout(() => { editSaveBtn.innerHTML = SAVE_ICON; }, 2500);
  }
}

editSaveBtn.addEventListener('click', saveEditChanges);

// ── Comment + Annotation Mode ──
const commentBtn = document.getElementById('comment-btn');
const commentLayer = document.getElementById('comment-layer');
const commentCanvas = document.getElementById('comment-canvas');
const commentPinsEl = document.getElementById('comment-pins');
const commentToolbar = document.getElementById('comment-toolbar');
const commentPopover = document.getElementById('comment-popover');
let cmtMode = false, cmtTool = 'rect', cmtDrawing = false;
let cmtStart = null, cmtPoints = [], cmtCtx = null;
let cmtData = {};
try { cmtData = JSON.parse(localStorage.getItem('wc-ds-annotations') || '{}'); } catch(e) {}

function cmtSave() { localStorage.setItem('wc-ds-annotations', JSON.stringify(cmtData)); }
function cmtList() { return cmtData[activeId] || []; }

function toggleCommentMode() {
  cmtMode = !cmtMode;
  commentBtn.classList.toggle('active', cmtMode);
  commentToolbar.classList.toggle('visible', cmtMode);
  if (cmtMode) {
    resizeCmtCanvas();
    commentLayer.classList.add('drawing');
    fetchCmtReplies().then(() => renderCmtAll());
  } else {
    commentLayer.classList.remove('drawing');
    commentPopover.classList.remove('open');
    cmtDrawing = false;
    renderCmtAll();
  }
}

function resizeCmtCanvas() {
  const r = commentCanvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  commentCanvas.width = r.width * dpr;
  commentCanvas.height = r.height * dpr;
  cmtCtx = commentCanvas.getContext('2d');
  cmtCtx.scale(dpr, dpr);
}

function cmtScroll() {
  try { const w = frame.contentWindow; return { x: w.scrollX || 0, y: w.scrollY || 0 }; }
  catch(e) { return { x: 0, y: 0 }; }
}
function cmtCoords(e) {
  const r = commentCanvas.getBoundingClientRect();
  const s = cmtScroll();
  return { x: e.clientX - r.left + s.x, y: e.clientY - r.top + s.y };
}
function cmtToViewport(cx, cy) {
  const s = cmtScroll();
  return { x: cx - s.x, y: cy - s.y };
}

// Drawing handlers
commentCanvas.addEventListener('mousedown', (e) => {
  if (!cmtMode || e.target !== commentCanvas) return;
  commentPopover.classList.remove('open');
  cmtDrawing = true;
  cmtStart = cmtCoords(e);
  cmtPoints = [cmtStart];
});

commentCanvas.addEventListener('mousemove', (e) => {
  if (!cmtDrawing) return;
  const p = cmtCoords(e);
  if (cmtTool === 'draw') cmtPoints.push(p);
  renderCmtAll(p);
});

commentCanvas.addEventListener('mouseup', (e) => {
  if (!cmtDrawing) return;
  cmtDrawing = false;
  const end = cmtCoords(e);
  const dist = cmtStart ? Math.hypot(end.x - cmtStart.x, end.y - cmtStart.y) : 0;
  let ann = null;
  if (dist < 5) {
    // Click — drop a pin at this location
    ann = { id: Date.now(), type: 'comment', x: end.x, y: end.y, text: '', ts: new Date().toISOString() };
  } else if (cmtTool === 'rect' && cmtStart) {
    const x = Math.min(cmtStart.x, end.x), y = Math.min(cmtStart.y, end.y);
    const w = Math.abs(end.x - cmtStart.x), h = Math.abs(end.y - cmtStart.y);
    ann = { id: Date.now(), type: 'rect', x, y, w, h, text: '', ts: new Date().toISOString() };
  } else if (cmtTool === 'draw' && cmtPoints.length > 3) {
    ann = { id: Date.now(), type: 'draw', points: cmtPoints.slice(), text: '', ts: new Date().toISOString() };
  }
  cmtStart = null;
  cmtPoints = [];
  if (ann) {
    showCmtInput(ann);
  } else {
    renderCmtAll();
  }
});

// Render annotations INSIDE the iframe DOM so they scroll naturally with content.
// Parent canvas is used ONLY for live drawing preview during drag.
function renderCmtAll(cursor) {
  if (!cmtCtx) return;
  const r = commentCanvas.parentElement.getBoundingClientRect();
  cmtCtx.clearRect(0, 0, r.width, r.height);

  // Inject saved annotations + pins into iframe DOM
  renderCmtInIframe();

  // In-progress drawing on parent canvas (viewport-space for live preview)
  if (cmtDrawing && cmtStart && cursor) {
    const sc = cmtScroll();
    if (cmtTool === 'rect') {
      const x = Math.min(cmtStart.x, cursor.x) - sc.x, y = Math.min(cmtStart.y, cursor.y) - sc.y;
      const w = Math.abs(cursor.x - cmtStart.x), h = Math.abs(cursor.y - cmtStart.y);
      cmtCtx.save();
      cmtCtx.strokeStyle = 'rgba(232,98,92,0.8)';
      cmtCtx.fillStyle = 'rgba(232,98,92,0.08)';
      cmtCtx.lineWidth = 2;
      cmtCtx.setLineDash([6, 4]);
      cmtCtx.strokeRect(x, y, w, h);
      cmtCtx.fillRect(x, y, w, h);
      cmtCtx.restore();
    } else if (cmtTool === 'draw' && cmtPoints.length > 1) {
      cmtCtx.save();
      cmtCtx.strokeStyle = 'rgba(232,98,92,0.8)';
      cmtCtx.lineWidth = 3;
      cmtCtx.lineCap = 'round';
      cmtCtx.lineJoin = 'round';
      cmtCtx.beginPath();
      cmtCtx.moveTo(cmtPoints[0].x - sc.x, cmtPoints[0].y - sc.y);
      cmtPoints.forEach(p => cmtCtx.lineTo(p.x - sc.x, p.y - sc.y));
      cmtCtx.stroke();
      cmtCtx.restore();
    }
  }
}

const CMT_LAYER_ID = '__wc-cmt-layer';

function renderCmtInIframe() {
  let iDoc;
  try { iDoc = frame.contentDocument; } catch(e) { return; }
  if (!iDoc || !iDoc.body) return;

  // Remove previous layer
  let layer = iDoc.getElementById(CMT_LAYER_ID);
  if (layer) layer.remove();
  if (!cmtMode) return;

  const list = cmtList();
  if (!list.length) return;

  // Create layer covering full scrollable content
  layer = iDoc.createElement('div');
  layer.id = CMT_LAYER_ID;
  const sh = Math.max(iDoc.documentElement.scrollHeight, iDoc.body.scrollHeight);
  const sw = Math.max(iDoc.documentElement.scrollWidth, iDoc.body.scrollWidth);
  layer.style.cssText = `position:absolute;top:0;left:0;width:${sw}px;height:${sh}px;pointer-events:none;z-index:2147483645;`;

  // SVG for shapes
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = iDoc.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', sw);
  svg.setAttribute('height', sh);
  svg.style.cssText = 'position:absolute;top:0;left:0;';

  list.forEach((a, i) => {
    const opacity = a.resolved ? 0.2 : 0.5;
    if (a.type === 'rect') {
      const rect = iDoc.createElementNS(svgNS, 'rect');
      rect.setAttribute('x', a.x); rect.setAttribute('y', a.y);
      rect.setAttribute('width', a.w); rect.setAttribute('height', a.h);
      rect.setAttribute('fill', 'rgba(232,98,92,0.06)');
      rect.setAttribute('stroke', '#e8625c');
      rect.setAttribute('stroke-width', '2');
      rect.setAttribute('stroke-dasharray', '6 4');
      rect.setAttribute('opacity', opacity);
      svg.appendChild(rect);
    } else if (a.type === 'draw' && a.points && a.points.length > 1) {
      const pl = iDoc.createElementNS(svgNS, 'polyline');
      pl.setAttribute('points', a.points.map(p => p.x+','+p.y).join(' '));
      pl.setAttribute('fill', 'none');
      pl.setAttribute('stroke', '#e8625c');
      pl.setAttribute('stroke-width', '3');
      pl.setAttribute('stroke-linecap', 'round');
      pl.setAttribute('stroke-linejoin', 'round');
      pl.setAttribute('opacity', opacity);
      svg.appendChild(pl);
    }

    // Pin (content-space coordinates — scrolls naturally)
    const pos = cmtPinPos(a);
    const pin = iDoc.createElement('div');
    pin.style.cssText = `position:absolute;left:${pos.x}px;top:${pos.y}px;width:22px;height:22px;
      background:${a.resolved ? '#5cb85c' : '#f5ac53'};border:2px solid #fff;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font:700 9px/1 Montserrat,sans-serif;
      color:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.35);
      pointer-events:auto;cursor:pointer;z-index:1;${a.resolved ? 'opacity:.6;' : ''}`;
    pin.textContent = i + 1;
    pin.addEventListener('click', (e) => {
      e.stopPropagation();
      const pinRect = pin.getBoundingClientRect();
      showCmtView(a, { x: pinRect.left, y: pinRect.top });
    });
    layer.appendChild(pin);
  });

  layer.appendChild(svg);
  iDoc.body.appendChild(layer);
}

function cmtPinPos(a) {
  if (a.type === 'comment') return { x: a.x, y: a.y };
  if (a.type === 'rect') return { x: a.x, y: a.y };
  if (a.type === 'draw' && a.points && a.points.length) return { x: a.points[0].x, y: a.points[0].y };
  return { x: 0, y: 0 };
}

// Comment input (new annotation)
function showCmtInput(ann) {
  const cpos = cmtPinPos(ann);
  const pos = cmtToViewport(cpos.x, cpos.y);
  const px = Math.min(pos.x + 20, commentLayer.offsetWidth - 280);
  const py = Math.min(pos.y + 20, commentLayer.offsetHeight - 180);
  commentPopover.style.left = px + 'px';
  commentPopover.style.top = py + 'px';
  commentPopover.innerHTML = `
    <textarea id="cmt-input" placeholder="Add a comment…" rows="2"></textarea>
    <div class="comment-popover-actions">
      <button class="comment-popover-btn primary" id="cmt-submit">Add</button>
      <button class="comment-popover-btn ghost" id="cmt-cancel">Cancel</button>
    </div>`;
  commentPopover.classList.add('open');
  renderCmtAll();
  // Draw pending annotation preview on parent canvas
  if (cmtCtx && ann.type === 'rect') {
    const sc = cmtScroll();
    cmtCtx.save(); cmtCtx.globalAlpha = 0.6;
    cmtCtx.strokeStyle = '#e8625c'; cmtCtx.fillStyle = 'rgba(232,98,92,0.06)';
    cmtCtx.lineWidth = 2; cmtCtx.setLineDash([6, 4]);
    cmtCtx.strokeRect(ann.x - sc.x, ann.y - sc.y, ann.w, ann.h);
    cmtCtx.fillRect(ann.x - sc.x, ann.y - sc.y, ann.w, ann.h);

  document.getElementById('cmt-submit').onclick = () => {

    commentPopover.classList.remove('open');

  });
}

// View existing comment (with thread)

    ann.replies.push(reply);
    cmtSave();

      await fetch('/api/reply', {
        method: 'POST',

// Fetch server-side replies and merge into local annotations
async function fetchCmtReplies() {
  if (!activeId) return;
  try {
    const resp = await fetch('/api/comments/' + activeId);
    const data = await resp.json();
    if (!data.comments || !data.comments.length) return;
    const local = cmtList();
    data.comments.forEach((serverCmt) => {
      if (!serverCmt.replies || !serverCmt.replies.length) return;
      // Match by timestamp (stable ID across client/server)
      const match = local.find(l => l.ts === serverCmt.timestamp);
      if (match) {
        match.replies = serverCmt.replies;
      } else {
        // Fallback: match by index using the server comment's position
        const idx = data.comments.indexOf(serverCmt);
        if (local[idx]) local[idx].replies = serverCmt.replies;
      }
    });
    cmtSave();
  } catch(e) { console.warn('fetchCmtReplies error:', e); }
}

// ── Inspect & Replace Mode ──
// Replaceable = components/modules/UI blocks that exist as standalone files.
// Skip Foundations (tokens) and Pages (replacement targets, not sources).
const REPLACEABLE_CATEGORIES = new Set(['UI Elements', 'Components', 'Modules']);
const SEMANTIC_TAGS = new Set(['SECTION', 'NAV', 'FOOTER', 'ARTICLE', 'HEADER', 'ASIDE', 'MAIN']);
const SCAFFOLD_CLASSES = ['sec', 'demo', 'lab', 'tweaks-panel-root'];

// ── React-project detection + JSX registry ──
// When the dashboard runs against a React project (components/HomePage.jsx exists),
// Inspect & Replace must operate on JSX source, not the HTML page bootstrap shell,
// because the rendered markup doesn't exist in pages-home.html (it's runtime JSX).
let _reactProject = null;        // boolean | null (lazily resolved)
let _reactRegistry = null;        // [{jsxName, tag, primaryClass}, ...]
// page-id → JSX page file. Hardcoded for known pages.
const REACT_PAGE_JSX = {
  'page-home': 'components/HomePage.jsx',
};

// TREE component-id → JSX component name. Used to:
// (a) repoint sidebar links to preview/iframe.html?component=<JsxName> in React mode
// (b) (future) reverse-lookup the JSX name from a clicked tree item.
// Add entries here as more TREE items gain JSX equivalents.
const TREE_TO_JSX = {
  'top-nav': 'Nav',
  'hero': 'Hero',
  'food-drink-card': 'FoodDrink',
  'fun-experience': 'Testimonials',
  'module-a': 'Games',
  'footer': 'Footer',
  'hero-footer-bg': 'BglineWave',
};

// In React mode, repoint sidebar items with JSX equivalents at the Storybook-style
// dynamic iframe (preview/iframe.html?component=<Name>). Items without a mapping
// (Foundations, Forms, etc.) keep their original components-*.html src.
async function applyReactSidebarRouting() {
  if (!(await isReactProject())) return;
  let repointed = 0;
  let activeRepointed = false;
  allItems.forEach(item => {
    const id = item.dataset.id;
    const jsxName = TREE_TO_JSX[id];
    if (!jsxName) return;
    item.dataset.src = 'preview/iframe.html?component=' + jsxName;
    repointed++;
    if (id === activeId) activeRepointed = true;
  });
  if (repointed) console.log('Repointed', repointed, 'sidebar items to JSX iframe.');
  // If the currently-active item's src changed, reload the iframe so the user sees the new render path.
  if (activeRepointed) {
    const cur = allItems.find(el => el.dataset.id === activeId);
    if (cur) frame.src = cur.dataset.src + (cur.dataset.src.includes('?') ? '&' : '?') + 't=' + Date.now();
  }
}

async function isReactProject() {
  if (_reactProject !== null) return _reactProject;
  try {
    const resp = await fetch('/components/HomePage.jsx', { method: 'HEAD' });
    _reactProject = resp.ok;
  } catch(_) { _reactProject = false; }
  return _reactProject;
}

// List JSX component names from /components/ directory listing.
async function listReactComponentFiles() {
  try {
    const resp = await fetch('/components/');
    if (!resp.ok) return [];
    const html = await resp.text();
    const names = [];
    const re = /href="([A-Z][a-zA-Z0-9]*)\.jsx"/g;
    let m;
    while ((m = re.exec(html))) names.push(m[1]);
    // Exclude composite page roots + non-section primitives (Btn, Deco, SvgSprite, BglineWave).
    const exclude = new Set(['HomePage', 'Btn', 'Deco', 'SvgSprite', 'BglineWave']);
    return names.filter(n => !exclude.has(n));
  } catch(_) { return []; }
}

// For each JSX file, parse the first-tag-with-className inside the function's return.
// Returns [{ jsxName, tag, primaryClass }]. Skips React.Fragment roots by drilling
// one level into the first child tag.
async function buildReactRegistry() {
  if (_reactRegistry) return _reactRegistry;
  const names = await listReactComponentFiles();
  const out = [];
  for (const name of names) {
    try {
      const resp = await fetch('/components/' + name + '.jsx?t=' + Date.now());
      if (!resp.ok) continue;
      const text = await resp.text();
      // Find the function NAME { ... return ( <JSX> ... ) ... }
      // Components often have helper `return () => {}` cleanup arrows inside useEffects — we
      // want the JSX-returning `return ( <…` specifically, so match `return\s*\(\s*<`.
      const fnIdx = text.search(new RegExp('function\\s+' + name + '\\b'));
      if (fnIdx < 0) continue;
      const after = text.slice(fnIdx);
      const jsxRetRe = /return\s*\(\s*</g;
      let lastMatch = null, mm;
      while ((mm = jsxRetRe.exec(after))) lastMatch = mm;
      if (!lastMatch) continue;
      // body starts at the `<` of the JSX root
      const bodyStart = lastMatch.index + lastMatch[0].length - 1;
      const body = after.slice(bodyStart);
      const clean = body.replace(/^\{\/\*[\s\S]*?\*\/\}\s*/, '');
      const tagMatch = clean.match(/^<([a-zA-Z][a-zA-Z0-9.]*)([^>]*?)\/?>/);
      if (!tagMatch) continue;
      let tag = tagMatch[1];
      let attrs = tagMatch[2];
      // Drill into fragment root to find the SEMANTIC DOM element. Prefer nav/section/
      // footer/article/header/aside/main (the section roots) over wrapper divs (backdrops, etc).
      if (tag === 'React.Fragment' || tag === '') {
        const SEMANTIC = /<(nav|section|footer|article|header|aside|main)([^>]*?)\/?>/i;
        const semMatch = clean.match(SEMANTIC);
        if (semMatch) {
          tag = semMatch[1]; attrs = semMatch[2];
        } else {
          const innerMatch = clean.match(/<([a-z][a-zA-Z0-9]*)([^>]*?)\/?>/);
          if (!innerMatch) continue;
          tag = innerMatch[1]; attrs = innerMatch[2];
        }
      }
      const clsMatch = attrs.match(/className=["']([^"']+)["']/);
      const primaryClass = clsMatch ? clsMatch[1].split(/\s+/)[0] : null;
      if (!primaryClass) continue; // Need a class to identify the rendered DOM
      out.push({ jsxName: name, tag: tag.toLowerCase(), primaryClass });
    } catch(_) {}
  }
  _reactRegistry = out;
  return out;
}

// Walk up DOM to find ancestor matching a React-registry entry.
function findReactComponentAt(el, registry) {
  let cur = el;
  while (cur && cur.tagName && cur.tagName !== 'BODY') {
    const tag = cur.tagName.toLowerCase();
    const cls = (cur.className && typeof cur.className === 'string') ? cur.className.split(/\s+/)[0] : '';
    for (const entry of registry) {
      if (entry.tag === tag && entry.primaryClass === cls) {
        return { el: cur, entry };
      }
    }
    cur = cur.parentElement;
  }
  return null;
}

function getReplaceableComponents() {
  const out = [];
  TREE.forEach(cat => {
    if (!REPLACEABLE_CATEGORIES.has(cat.cat)) return;
    cat.children.forEach(child => {
      if (child.items) {
        child.items.forEach(it => out.push({ ...it, group: cat.cat }));
      } else {
        out.push({ ...child, group: cat.cat });
      }
    });
  });
  return out;
}

const inspectBtn = document.getElementById('inspect-btn');
const inspectHoverOvl = document.getElementById('inspect-hover-overlay');
const inspectSelOvl = document.getElementById('inspect-select-overlay');
const inspectTooltip = document.getElementById('inspect-tooltip');
const replaceBackdrop = document.getElementById('replace-backdrop');
