let inspectActive = false;
let inspectSelectedEl = null;
// Stable selector path for the selected element (survives iframe reload).
let inspectSelectedPath = null;
// React-mode: when set, the click identified a JSX component instance.
// { jsxName: string, index: number } — index = which Nth occurrence in HomePage.jsx (0-based).
let inspectReactComponent = null;

function inspectIframeOff() { const r = frame.getBoundingClientRect(); return { t: r.top, l: r.left }; }
function inspectPlaceOvl(o, rect, f) {
  o.style.display = 'block';
  o.style.top = (f.t + rect.top) + 'px';
  o.style.left = (f.l + rect.left) + 'px';
  o.style.width = rect.width + 'px';
  o.style.height = rect.height + 'px';
}

// Walk up the DOM to find the nearest semantic block (section/nav/footer/article/header/aside/main)
// OR a direct child of <body> (top-level layout block).
function findReplaceableAncestor(el, doc) {
  let cur = el;
  while (cur && cur !== doc.body && cur !== doc.documentElement) {
    if (SEMANTIC_TAGS.has(cur.tagName)) return cur;
    if (cur.parentElement === doc.body) return cur;
    cur = cur.parentElement;
  }
  return null;
}

function describePath(el) {
  const parts = [];
  let cur = el;
  while (cur && cur.tagName && cur.tagName !== 'BODY' && parts.length < 4) {
    let label = cur.tagName.toLowerCase();
    if (cur.id) label += '#' + cur.id;
    else if (cur.classList.length) {
      const cls = Array.from(cur.classList).slice(0, 2).join('.');
      if (cls) label += '.' + cls;
    }
    parts.unshift(label);
    cur = cur.parentElement;
  }
  return parts.join(' > ');
}

// Build a stable selector path from <body> to el using nth-of-type indices.
// Used to re-locate the selected element after the iframe reloads (or in a fresh full-page DOM).
function buildStableSelector(el, doc) {
  const parts = [];
  let cur = el;
  while (cur && cur !== doc.body && cur !== doc.documentElement) {
    const parent = cur.parentElement;
    if (!parent) break;
    const tag = cur.tagName.toLowerCase();
    // index among siblings of same tag
    let i = 1, sib = cur;
    while ((sib = sib.previousElementSibling)) {
      if (sib.tagName === cur.tagName) i++;
    }
    parts.unshift(tag + ':nth-of-type(' + i + ')');
    cur = parent;
  }
  return 'body > ' + parts.join(' > ');
}

function toggleInspectMode() {
  if (!inspectActive) {
    enterInspectMode();
  } else {
    exitInspectMode();
  }
}

function enterInspectMode() {
  // Exit other modes first
  if (editActive) exitEditMode();
  if (cmtMode) toggleCommentMode();
  if (tweaksActive) {
    try { frame.contentWindow.postMessage({ type: '__deactivate_edit_mode' }, '*'); } catch(e) {}
    setTweaksActive(false);
  }
  inspectActive = true;
  inspectBtn.classList.add('active');
  btnLooksGood.disabled = btnNeedsWork.disabled = true;
  editBtn.disabled = true;
  commentBtn.disabled = true;
  bindInspectIframe();
  // Warm up React registry if this is a React project — click handler relies on it.
  isReactProject().then(yes => { if (yes) buildReactRegistry(); });
}

function exitInspectMode() {
  inspectActive = false;
  inspectBtn.classList.remove('active');
  btnLooksGood.disabled = btnNeedsWork.disabled = false;
  editBtn.disabled = false;
  commentBtn.disabled = false;
  inspectSelectedEl = null;
  inspectSelectedPath = null;
  inspectReactComponent = null;
  inspectHoverOvl.style.display = inspectSelOvl.style.display = inspectTooltip.style.display = 'none';
  unbindInspectIframe();
  closeReplaceDialog();
}

function bindInspectIframe() {
  const tryBind = () => {
    try {
      const d = frame.contentDocument;
      if (!d || !d.body) { setTimeout(tryBind, 100); return; }
      d.addEventListener('mousemove', onInspectMove);
      d.addEventListener('click', onInspectClick, true);
      d.addEventListener('mouseleave', onInspectLeave);
      frame.contentWindow.addEventListener('scroll', onInspectScroll);
    } catch(e) { setTimeout(tryBind, 100); }
  };
  tryBind();
}

function unbindInspectIframe() {
  try {
    const d = frame.contentDocument;
    if (!d) return;
    d.removeEventListener('mousemove', onInspectMove);
    d.removeEventListener('click', onInspectClick, true);
    d.removeEventListener('mouseleave', onInspectLeave);
    frame.contentWindow.removeEventListener('scroll', onInspectScroll);
  } catch(e) {}
}

function onInspectMove(e) {
  if (!inspectActive) return;
  const d = frame.contentDocument;
  const raw = d.elementFromPoint(e.clientX, e.clientY);
  if (!raw) { inspectHoverOvl.style.display = inspectTooltip.style.display = 'none'; return; }
  const target = findReplaceableAncestor(raw, d);
  if (!target || target === inspectSelectedEl) {
    inspectHoverOvl.style.display = inspectTooltip.style.display = 'none';
    return;
  }
  const rect = target.getBoundingClientRect();
  const f = inspectIframeOff();
  inspectPlaceOvl(inspectHoverOvl, rect, f);
  inspectTooltip.textContent = describePath(target) + ' · ' + Math.round(rect.width) + ' × ' + Math.round(rect.height);
  inspectTooltip.style.display = 'block';
  let ttTop = f.t + rect.top - 26;
  if (ttTop < f.t) ttTop = f.t + rect.bottom + 4;
  inspectTooltip.style.top = ttTop + 'px';
  inspectTooltip.style.left = (f.l + rect.left) + 'px';
}

function onInspectLeave() {
  inspectHoverOvl.style.display = inspectTooltip.style.display = 'none';
}

async function onInspectClick(e) {
  if (!inspectActive) return;
  e.preventDefault();
  e.stopPropagation();
  const d = frame.contentDocument;
  const raw = d.elementFromPoint(e.clientX, e.clientY);
  if (!raw) return;

  // React-project branch: prefer the React-component match over generic semantic ancestor.
  // Falls back to HTML-mode if not a React project OR if no registry match found.
  let target = null;
  inspectReactComponent = null;
  if (await isReactProject()) {
    const registry = await buildReactRegistry();
    const hit = findReactComponentAt(raw, registry);
    if (hit) {
      target = hit.el;
      // Compute Nth-occurrence index for this JSX name across the rendered DOM.
      // Match by tag + primaryClass — same heuristic the registry uses.
      const same = Array.from(d.querySelectorAll(hit.entry.tag))
        .filter(el => (el.className && typeof el.className === 'string'
          ? el.className.split(/\s+/)[0] === hit.entry.primaryClass : false));
      const index = same.indexOf(hit.el);
      inspectReactComponent = { jsxName: hit.entry.jsxName, index: index < 0 ? 0 : index };
    }
  }
  // Fallback: HTML-mode semantic ancestor walk
  if (!target) {
    target = findReplaceableAncestor(raw, d);
  }
  if (!target) return;

  inspectSelectedEl = target;
  inspectSelectedPath = buildStableSelector(target, d);
  inspectPlaceOvl(inspectSelOvl, target.getBoundingClientRect(), inspectIframeOff());
  inspectHoverOvl.style.display = inspectTooltip.style.display = 'none';
  openReplaceDialog(target);
}

function onInspectScroll() {
  if (inspectSelectedEl) {
    try {
      inspectPlaceOvl(inspectSelOvl, inspectSelectedEl.getBoundingClientRect(), inspectIframeOff());
    } catch(e) {}
  }
}

// ── Replace dialog ──
function populateComponentSelect() {
  // Clear except first
  while (replaceSelect.options.length > 1) replaceSelect.remove(1);
  replaceSelect.dataset.mode = 'html';
  const comps = getReplaceableComponents();
  // Group by category
  const byGroup = {};
  comps.forEach(c => { (byGroup[c.group] = byGroup[c.group] || []).push(c); });
  Object.keys(byGroup).forEach(grp => {
    const og = document.createElement('optgroup');
    og.label = grp;
    byGroup[grp].forEach(c => {
      const op = document.createElement('option');
      op.value = c.src;
      op.dataset.id = c.id;
      op.textContent = c.label;
      og.appendChild(op);
    });
    replaceSelect.appendChild(og);
  });
}

function openReplaceDialog(target) {
  // React-mode: show the JSX component identity + populate dropdown with JSX components.
  if (inspectReactComponent) {
    replaceTargetPath.textContent = '<' + inspectReactComponent.jsxName + ' />  (' + describePath(target) + ')';
    populateReactComponentSelect();
  } else {
    replaceTargetPath.textContent = describePath(target);
    if (replaceSelect.options.length <= 1 || replaceSelect.dataset.mode === 'react') populateComponentSelect();
  }
  replaceSelect.value = '';
  replacePreview.innerHTML = '<div class="replace-preview-empty">Select a component to preview</div>';
  replaceApply.disabled = true;
  replaceApply.classList.remove('saving');
  // Reset action to Replace on each open so behavior is predictable.
  setReplaceAction('replace');
  replaceApply.textContent = applyButtonLabel();
  replaceBackdrop.classList.add('open');
  setTimeout(() => replaceSelect.focus(), 50);
}

// Populate dropdown with React JSX components (lives in components/*.jsx).
// Used only when the dashboard detects a React project AND the click hit a recognized component.
async function populateReactComponentSelect() {
  while (replaceSelect.options.length > 1) replaceSelect.remove(1);
  replaceSelect.dataset.mode = 'react';
  const registry = await buildReactRegistry();
  registry.forEach(entry => {
    const op = document.createElement('option');
    // Value carries jsxName; preview src is the matching components-*.html if available
    op.value = 'jsx:' + entry.jsxName;
    op.dataset.jsxName = entry.jsxName;
    op.textContent = entry.jsxName;
    replaceSelect.appendChild(op);
  });
}

function closeReplaceDialog() {
  replaceBackdrop.classList.remove('open');
  replacePreview.innerHTML = '<div class="replace-preview-empty">Select a component to preview</div>';
  replaceSelect.value = '';
  replaceApply.disabled = true;
}

replaceSelect.addEventListener('change', () => {
  const src = replaceSelect.value;
  if (!src) {
    replacePreview.innerHTML = '<div class="replace-preview-empty">Select a component to preview</div>';
    replaceApply.disabled = true;
    return;
  }
  if (src.startsWith('jsx:')) {
    // React mode — show the corresponding components-*.html preview when convention matches.
    // Map JsxName → preview/components-<kebab>.html; fall back to a textual placeholder.
    const jsxName = src.slice(4);
    const kebab = jsxName.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
    const previewSrc = 'preview/components-' + kebab + '.html';
    replacePreview.innerHTML = '<iframe src="' + previewSrc + '?t=' + Date.now() + '" title="Component preview" onerror="this.style.display=\'none\'"></iframe>';
    replaceApply.disabled = false;
    return;
  }
  // HTML mode — live iframe preview
  replacePreview.innerHTML = '<iframe src="' + src + '?t=' + Date.now() + '" title="Component preview"></iframe>';
  replaceApply.disabled = false;
});

replaceClose.addEventListener('click', closeReplaceDialog);
replaceCancel.addEventListener('click', closeReplaceDialog);
replaceBackdrop.addEventListener('click', (e) => {
  if (e.target === replaceBackdrop) closeReplaceDialog();
});

// Extract the "essential" component markup from a component preview file.
// Strategy: find first body-level element that's <section>/<nav>/<footer>/<article>/<header>/<aside>/<main>
// and whose className doesn't start with a known scaffolding class (`sec`, `demo`, `lab`).
async function extractComponentHTML(src) {
  const resp = await fetch(src + '?t=' + Date.now());
  if (!resp.ok) throw new Error('Fetch failed: ' + src);
  const text = await resp.text();
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const body = doc.body;
  if (!body) throw new Error('No <body> in component file');

  // Walk direct children of body; collect ALL semantic blocks not in scaffolding.
  const candidates = [];
  for (const child of body.children) {
    if (!child.tagName) continue;
    if (!SEMANTIC_TAGS.has(child.tagName)) continue;
    // Skip scaffolding wrappers
    const cls = child.className || '';
    const skip = SCAFFOLD_CLASSES.some(s => (' ' + cls + ' ').includes(' ' + s + ' '));
    if (skip) continue;
    // Skip the tweaks-panel root (script-injected)
    if (child.id === 'tweaks-panel-root') continue;
    candidates.push(child);
  }

  if (!candidates.length) {
    // Fallback: search one level deeper (some components wrap in `.sec` or `.demo`)
    const deep = body.querySelector('section, nav, footer, article, header, aside, main');
    if (deep) return deep.outerHTML;
    throw new Error('No semantic component block found in ' + src);
  }

  // If multiple, return them all wrapped — but typically one. Pick first.
  return candidates.map(c => c.outerHTML).join('\n');
}

replaceApply.addEventListener('click', async () => {
  if (replaceApply.disabled) return;
  if (!activeId) return;
  const src = replaceSelect.value;
  if (!src) return;

  const item = allItems.find(el => el.dataset.id === activeId);
  if (!item) return;
  const pageFilePath = item.dataset.src;

  replaceApply.classList.add('saving');
  replaceApply.disabled = true;
  replaceApply.textContent = 'Applying…';

  // ── React JSX branch ──────────────────────────────────────────
  if (src.startsWith('jsx:') && inspectReactComponent) {
    const newJsxName = src.slice(4);
    const jsxPageFile = REACT_PAGE_JSX[activeId];
    if (!jsxPageFile) {
      replaceApply.classList.remove('saving');
      replaceApply.textContent = '✗ No JSX page mapping';
      replaceApply.disabled = false;
      setTimeout(() => { replaceApply.textContent = applyButtonLabel(); }, 2500);
      return;
    }
    try {
      const resp = await fetch('/' + jsxPageFile + '?t=' + Date.now());
      if (!resp.ok) throw new Error('Failed to fetch ' + jsxPageFile);
      let text = await resp.text();
      const { jsxName: oldName, index } = inspectReactComponent;
      const tagRe = new RegExp('<' + oldName + '\\b[^>]*\\/>', 'g');
      const matches = [];
      let m;
      while ((m = tagRe.exec(text))) matches.push({ start: m.index, end: m.index + m[0].length, raw: m[0] });
      if (!matches.length) throw new Error('No <' + oldName + ' /> in ' + jsxPageFile);
      const targetMatch = matches[Math.min(index, matches.length - 1)];

      let newText;
      const insertJsx = '<' + newJsxName + ' />';
      if (replaceAction === 'replace') {
        newText = text.slice(0, targetMatch.start) + insertJsx + text.slice(targetMatch.end);
      } else {
        // Insert-before / Insert-after — preserve indentation by inspecting the line that holds the target.
        const lineStart = text.lastIndexOf('\n', targetMatch.start) + 1;
        // Indent = leading whitespace on that line
        const indentMatch = text.slice(lineStart, targetMatch.start).match(/^[ \t]*/);
        const indent = indentMatch ? indentMatch[0] : '';
        const insertLine = indent + insertJsx + '\n';
        if (replaceAction === 'insert-before') {
          newText = text.slice(0, lineStart) + insertLine + text.slice(lineStart);
        } else {
          // insert-after: insert AFTER the target's line — find end-of-line
          const lineEnd = text.indexOf('\n', targetMatch.end);
          const insertPoint = lineEnd >= 0 ? lineEnd + 1 : text.length;
          newText = text.slice(0, insertPoint) + insertLine + text.slice(insertPoint);
        }
      }

      const saveResp = await fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: jsxPageFile, content: newText }),
      });
      const data = await saveResp.json();
      if (!saveResp.ok || !data.ok) throw new Error(data.error || 'Save failed');
      replaceApply.classList.remove('saving');
      replaceApply.textContent = '✓ Saved';
      setTimeout(() => {
        closeReplaceDialog();
        frame.src = pageFilePath + '?t=' + Date.now();
        inspectSelectedEl = null;
        inspectSelectedPath = null;
        inspectReactComponent = null;
        inspectSelOvl.style.display = 'none';
      }, 600);
    } catch (err) {
      console.error('React ' + replaceAction + ' failed:', err);
      replaceApply.classList.remove('saving');
      replaceApply.textContent = '✗ ' + (err.message || 'Error');
      replaceApply.disabled = false;
      setTimeout(() => { replaceApply.textContent = applyButtonLabel(); }, 2500);
    }
    return;
  }

  // ── HTML (raw-markup) branch ─────────────────────────────────
  if (!inspectSelectedPath) {
    replaceApply.classList.remove('saving');
    replaceApply.textContent = '✗ No selection path';
    replaceApply.disabled = false;
    setTimeout(() => { replaceApply.textContent = applyButtonLabel(); }, 2500);
    return;
  }

  try {
    // 1) Fetch fresh page source from disk (so we save authoritative HTML, not a possibly-mutated iframe DOM).
    const pageResp = await fetch('/' + pageFilePath + '?t=' + Date.now());
    if (!pageResp.ok) throw new Error('Failed to fetch page source');
    const pageText = await pageResp.text();
    const pageDoc = new DOMParser().parseFromString(pageText, 'text/html');

    // 2) Re-locate the selected element in the freshly-parsed doc via stable selector.
    let targetEl = null;
    try { targetEl = pageDoc.querySelector(inspectSelectedPath); } catch(e) {}
    if (!targetEl) {
      // Fallback: also try without the leading "body > " prefix
      try { targetEl = pageDoc.querySelector(inspectSelectedPath.replace(/^body\s*>\s*/, '')); } catch(e) {}
    }
    if (!targetEl) throw new Error('Could not locate selected element in page source');

    // 3) Fetch + extract component HTML
    const componentHTML = await extractComponentHTML(src);

    // 4) Apply action: replace | insert-before | insert-after
    const wrapper = pageDoc.createElement('div');
    wrapper.innerHTML = componentHTML;
    const newNodes = Array.from(wrapper.childNodes);
    if (!newNodes.length) throw new Error('Empty component HTML');
    if (replaceAction === 'replace') {
      newNodes.forEach(n => targetEl.parentNode.insertBefore(n, targetEl));
      targetEl.parentNode.removeChild(targetEl);
    } else if (replaceAction === 'insert-before') {
      newNodes.forEach(n => targetEl.parentNode.insertBefore(n, targetEl));
    } else if (replaceAction === 'insert-after') {
      // Insert in reverse so order is preserved.
      newNodes.slice().reverse().forEach(n => {
        if (targetEl.nextSibling) targetEl.parentNode.insertBefore(n, targetEl.nextSibling);
        else targetEl.parentNode.appendChild(n);
      });
    }

    // 5) Serialize and save
    const dt = pageDoc.doctype;
    const doctype = dt ? '<!doctype ' + dt.name + '>\n' : '<!doctype html>\n';
    const html = doctype + pageDoc.documentElement.outerHTML + '\n';

    const saveResp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: pageFilePath, content: html }),
    });
    const data = await saveResp.json();
    if (!saveResp.ok || !data.ok) throw new Error(data.error || 'Save failed');

    // 6) Success — close dialog, reload iframe
    replaceApply.classList.remove('saving');
    replaceApply.textContent = '✓ Saved';
    setTimeout(() => {
      closeReplaceDialog();
      // Reload the iframe to show updated content. Keep inspect mode active.
      frame.src = pageFilePath + '?t=' + Date.now();
      // Clear selection — element reference is stale after reload
      inspectSelectedEl = null;
      inspectSelectedPath = null;
      inspectSelOvl.style.display = 'none';
    }, 600);
  } catch (err) {
    console.error('HTML ' + replaceAction + ' failed:', err);
    replaceApply.classList.remove('saving');
    replaceApply.textContent = '✗ ' + (err.message || 'Error');
    replaceApply.disabled = false;
    setTimeout(() => { replaceApply.textContent = applyButtonLabel(); }, 2500);
  }
});

inspectBtn.addEventListener('click', toggleInspectMode);

// Re-bind inspect listeners when the iframe reloads in inspect mode
frame.addEventListener('load', () => {
  if (inspectActive) {
    // Clear stale references; re-bind listeners on the new document.
    inspectSelectedEl = null;
    inspectSelectedPath = null;
    inspectSelOvl.style.display = 'none';
    bindInspectIframe();
  }
});

// ── Drag-and-drop: sidebar component → iframe ──
const DND_MIME = 'application/x-wc-component';
const DND_INDICATOR_ID = '__wc-dnd-indicator';
let dndCurrentSrc = null;
let dndCurrentLabel = null;

// Make replaceable sidebar items draggable.
// Reuse getReplaceableComponents() so the source-of-truth stays single.
function initSidebarDrag() {
  const replaceableIds = new Set(getReplaceableComponents().map(c => c.id));
  allItems.forEach(item => {
    const id = item.dataset.id;
    if (!replaceableIds.has(id)) return;
    item.classList.add('draggable-component');
    item.setAttribute('draggable', 'true');
    item.addEventListener('dragstart', onSidebarDragStart);
    item.addEventListener('dragend', onSidebarDragEnd);
  });
}

function onSidebarDragStart(e) {
  const item = e.currentTarget;
  const src = item.dataset.src;
  const label = item.querySelector('.item-label').textContent;
  if (!src) { e.preventDefault(); return; }
  dndCurrentSrc = src;
  dndCurrentLabel = label;
  try {
    e.dataTransfer.setData(DND_MIME, src);
    e.dataTransfer.setData('text/plain', src);
  } catch(_) {}
  e.dataTransfer.effectAllowed = 'copy';
  item.classList.add('dragging');
  document.body.classList.add('wc-dragging');
  // Bind iframe-side listeners now (iframe document may not have heard them yet)
  bindDndIframe();
}

function onSidebarDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.body.classList.remove('wc-dragging');
  dndCurrentSrc = null;
  dndCurrentLabel = null;
  removeDndIndicator();
}

// Bind dragover/drop on iframe document. Idempotent.
function bindDndIframe() {
  const tryBind = () => {
    try {
      const d = frame.contentDocument;
      if (!d || !d.body) { setTimeout(tryBind, 100); return; }
      if (d.__wc_dnd_bound) return;
      d.__wc_dnd_bound = true;
      d.addEventListener('dragover', onDndOver);
      d.addEventListener('dragleave', onDndLeave);
      d.addEventListener('drop', onDndDrop);
    } catch(e) { setTimeout(tryBind, 100); }
  };
  tryBind();
}

function findInsertionTarget(d, clientY) {
  // Look at top-level body children (the natural layout sections).
  const children = Array.from(d.body.children).filter(c => {
    if (!c.tagName) return false;
    // Skip injected overlays / non-content
    if (c.id === DND_INDICATOR_ID) return false;
    if (c.id === CMT_LAYER_ID) return false;
    if (c.id === '__wc-cmt-layer') return false;
    if (c.tagName === 'SCRIPT' || c.tagName === 'STYLE' || c.tagName === 'LINK' || c.tagName === 'SVG') return false;
    // Hidden / zero-height elements
    const r = c.getBoundingClientRect();
    if (r.height < 1) return false;
    return true;
  });
  if (!children.length) return null;
  for (let i = 0; i < children.length; i++) {
    const r = children[i].getBoundingClientRect();
    const mid = r.top + r.height / 2;
    if (clientY < mid) return { el: children[i], where: 'before' };
  }
  // After the last
  return { el: children[children.length - 1], where: 'after' };
}

function showDndIndicator(d, target) {
  let ind = d.getElementById(DND_INDICATOR_ID);
  if (!ind) {
    ind = d.createElement('div');
    ind.id = DND_INDICATOR_ID;
    ind.style.cssText = 'position:absolute;left:0;right:0;height:4px;background:#b39ddb;box-shadow:0 0 8px #b39ddb,0 0 16px rgba(179,157,219,0.5);z-index:2147483646;pointer-events:none;border-radius:2px;';
    d.body.appendChild(ind);
  }
  // Position relative to body / document
  const rect = target.el.getBoundingClientRect();
  const scrollTop = (d.defaultView && d.defaultView.scrollY) || 0;
  const top = target.where === 'before'
    ? rect.top + scrollTop - 2
    : rect.bottom + scrollTop - 2;
  ind.style.top = top + 'px';
}

function removeDndIndicator() {
  try {
    const d = frame.contentDocument;
    if (!d) return;
    const ind = d.getElementById(DND_INDICATOR_ID);
    if (ind) ind.remove();
  } catch(_) {}
}

function onDndOver(e) {
  // Accept drop only if we have a known source (or the mime type matches)
  const hasMime = e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf(DND_MIME) !== -1;
  if (!hasMime && !dndCurrentSrc) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  const d = frame.contentDocument;
  const target = findInsertionTarget(d, e.clientY);
  if (target) showDndIndicator(d, target);
}

function onDndLeave(e) {
  // Only hide indicator when leaving the document, not just moving between children.
  if (e.target === frame.contentDocument || e.target === frame.contentDocument.body) {
    removeDndIndicator();
  }
}

async function onDndDrop(e) {
  e.preventDefault();
  const d = frame.contentDocument;
  let src = dndCurrentSrc;
  if (!src) {
    try { src = e.dataTransfer.getData(DND_MIME) || e.dataTransfer.getData('text/plain'); } catch(_) {}
  }
  removeDndIndicator();
  if (!src) return;
  const target = findInsertionTarget(d, e.clientY);
  if (!target || !activeId) return;

  // Build stable selector for the target sibling in the live iframe doc.
  const siblingSelector = buildStableSelector(target.el, d);
  const where = target.where;

  const item = allItems.find(el => el.dataset.id === activeId);
  if (!item) return;
  const pageFilePath = item.dataset.src;

  try {
    // 1. Fetch fresh page source
    const pageResp = await fetch('/' + pageFilePath + '?t=' + Date.now());
    if (!pageResp.ok) throw new Error('Failed to fetch page source');
    const pageText = await pageResp.text();
    const pageDoc = new DOMParser().parseFromString(pageText, 'text/html');

    // 2. Locate sibling
    let siblingEl = null;
    try { siblingEl = pageDoc.querySelector(siblingSelector); } catch(_) {}
    if (!siblingEl) {
      try { siblingEl = pageDoc.querySelector(siblingSelector.replace(/^body\s*>\s*/, '')); } catch(_) {}
    }
    if (!siblingEl) throw new Error('Could not locate sibling in page source');

    // 3. Extract component HTML
    const componentHTML = await extractComponentHTML(src);

    // 4. Insert
    const wrapper = pageDoc.createElement('div');
    wrapper.innerHTML = componentHTML;
    const newNodes = Array.from(wrapper.childNodes);
    if (!newNodes.length) throw new Error('Empty component HTML');
    if (where === 'before') {
      newNodes.forEach(n => siblingEl.parentNode.insertBefore(n, siblingEl));
    } else {
      // after: insert in reverse so order is preserved
      newNodes.slice().reverse().forEach(n => {
        if (siblingEl.nextSibling) siblingEl.parentNode.insertBefore(n, siblingEl.nextSibling);
        else siblingEl.parentNode.appendChild(n);
      });
    }

    // 5. Save
    const dt = pageDoc.doctype;
    const doctype = dt ? '<!doctype ' + dt.name + '>\n' : '<!doctype html>\n';
    const html = doctype + pageDoc.documentElement.outerHTML + '\n';
    const saveResp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: pageFilePath, content: html }),
    });
    const data = await saveResp.json();
    if (!saveResp.ok || !data.ok) throw new Error(data.error || 'Save failed');

    // 6. Reload iframe
    frame.src = pageFilePath + '?t=' + Date.now();
  } catch (err) {
    console.error('Drop-insert failed:', err);
    // Lightweight inline feedback — flash the topbar-current with the error briefly
    const orig = topCurrent.textContent;
    topCurrent.style.color = '#e8625c';
    topCurrent.textContent = '✗ Insert failed: ' + (err.message || 'error');
    setTimeout(() => { topCurrent.style.color = ''; topCurrent.textContent = orig; }, 3500);
  }
}

// Initialize sidebar drag after items are rendered (TREE.forEach above populated allItems).
initSidebarDrag();

// Re-bind iframe drop listeners on every iframe reload so new docs accept drops.
frame.addEventListener('load', () => {
  // Reset bound-flag because the document object changes on reload.
  try { if (frame.contentDocument) frame.contentDocument.__wc_dnd_bound = false; } catch(_) {}
  bindDndIframe();
});
// Also bind on the initial document.
bindDndIframe();

// Exit inspect mode on Esc
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && inspectActive) {
    if (replaceBackdrop.classList.contains('open')) closeReplaceDialog();
    else exitInspectMode();
  }
});

// ── Hash routing ──
function loadFromHash() {
  const hash = location.hash.replace('#', '');
  if (hash && allItems.find(el => el.dataset.id === hash)) {
    selectItem(hash);
  } else if (allItems.length) {
    selectItem(allItems[0].dataset.id);
  }
}
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
window.addEventListener('hashchange', loadFromHash);
loadFromHash();

// ── Keyboard nav ──
document.addEventListener('keydown', (e) => {
  const focusable = allItems.filter(el => {
    // Check if item is visible (not in collapsed parent)
    let p = el.parentElement;
    while (p && p !== scroll) {
      if ((p.classList.contains('cat-items') || p.classList.contains('subcat-items'))
        && p.parentElement.classList.contains('collapsed')) return false;
      p = p.parentElement;
    }
    return true;
  });

  const curIdx = focusable.indexOf(document.activeElement);

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = curIdx < focusable.length - 1 ? curIdx + 1 : 0;
    focusable[next].focus();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = curIdx > 0 ? curIdx - 1 : focusable.length - 1;
    focusable[prev].focus();
  } else if (e.key === 'Enter' && curIdx >= 0) {
    e.preventDefault();
    selectItem(focusable[curIdx].dataset.id);
  }
});

// ── Mobile toggle ──
document.getElementById('hamburger').addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
});

// ── Set max-heights for transitions ──
function setMaxHeights() {
  document.querySelectorAll('.cat-items').forEach(el => {
    if (!el.parentElement.classList.contains('collapsed')) {
      el.style.maxHeight = el.scrollHeight + 'px';
    }
  });
  document.querySelectorAll('.subcat-items').forEach(el => {
    if (!el.parentElement.classList.contains('collapsed')) {
      el.style.maxHeight = el.scrollHeight + 'px';
    }
  });
}
// Re-calc on toggle
const observer = new MutationObserver(() => {
  requestAnimationFrame(setMaxHeights);
});
document.querySelectorAll('.cat, .subcat').forEach(el => {
  observer.observe(el, { attributes: true, attributeFilter: ['class'] });
});
setMaxHeights();
updateProgress();
</script>
